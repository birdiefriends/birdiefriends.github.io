  <h1>That&rsquo;s a Wrap<b>The Championship Series</b></h1>
  <p>Seven events. Thirty-one players. One Series champion. Pull up a chair, folks, because the 2026 season is officially in the books and what a ride it was.</p>
  <div class="stats">

<h2>Ladies and gentlemen, your champions</h2>
<div class="lede">Nineteen players qualified for the Season Pot at $20 a head: $380 on the line, with the Overall crown and three flights up for grabs.</div>

<div class="card champ">
  <div class="kicker">🏆 Overall Champion </div>
  <div class="big">BJ Kolonia</div>
  <p>And BJ Kolonia takes the whole thing! He sat third on the podium back in Series #3, climbed to second in #9, then came into the finale and <b>won it outright</b> at +3.65. A series score of <b>+10.27</b> is the best in the field by nearly three and a half points. Add the Combo flight title and BJ walks off with <span class="money">$117</span> from the Season Pot alone. Just a masterclass in finishing.</p>
</div>

<div class="card">
  <p><b>Overall runners-up.</b> <b>Rich Potts</b> finishes second at +6.78 for <span class="money">$46</span>, and <b>Jeff Rapp</b> takes third at +6.56 for <span class="money">$30</span>. Rapp did it the hard way: he teed it up in <b>all seven events</b> and finished above quota in four of them. That&rsquo;s what we call showing up.</p>
</div>

<div class="card">
  <table class="flights">
    <tr><th>Flight</th><th>1st</th><th>2nd</th><th>3rd</th></tr>
    <tr><td><b>Green</b> <span class="pill Green">9 qualified</span></td><td>Evan Lindermuth<br><span class="money">$40</span></td><td>Jordan Knappenberger<br><span class="money">$24</span></td><td>Bill Steirer<br><span class="money">$16</span></td></tr>
    <tr><td><b>Combo</b> <span class="pill Combo">8 qualified</span></td><td>BJ Kolonia<br><span class="money">$40</span></td><td>Rich Potts<br><span class="money">$24</span></td><td>Jeff Rapp<br><span class="money">$16</span></td></tr>
    <tr><td><b>Gold</b> <span class="pill Gold">2 qualified</span></td><td>Rich Penberg<br><span class="money">$40</span></td><td>Scott Skeens<br><span class="money">$24</span></td><td>&mdash;</td></tr>
  </table>
</div>

<div class="card">
  <p><b>Green flight.</b> Evan Lindermuth takes it at +4.71, and he saved his loudest work for Series #9, where he posted <b>+9.28 over quota, the best single round of the entire season</b>. Jordan Knappenberger and Bill Steirer complete the Green podium.</p>
  <p><b>Gold flight.</b> The new Gold tees brought only two qualifiers this year, so the unclaimed third-place money was spread across every other prize. Rich Penberg takes the title, and, folks, he <b>played all seven events</b>. Scott Skeens is right behind for second.</p>
</div>

<h2>The season, event by event</h2>
<div class="lede">Seven events, and here&rsquo;s the one for the trivia night: <b>seven different winners</b>. Nobody won twice. This league is wide open.</div>

<div class="card ev"><h3>Series #2 · May 3 · 17 players</h3><div class="w">Chooch Wernett</div><div class="pod">+2.44 · 2nd Mohamed Walli (+2.33) · 3rd Jeremy Burkett (+1.16)</div>
<p>Chooch opened the season with a photo finish. A tenth of a point separated him from Mohamed Walli, and he added a skin and a closest-to-the-pin on the 15th for a <b>$105 day</b>.</p></div>

<div class="card ev"><h3>Series #3 · May 31 · 22 players</h3><div class="w">Adam Costa</div><div class="pod">+6.34 · 2nd Carl Stadtmueller (+4.41) · 3rd BJ Kolonia (+3.10)</div>
<p>The biggest field of the year, and Adam Costa ran away from it by nearly two points. Harry Pry grabbed a pair of skins to make some noise of his own.</p></div>

<div class="card ev"><h3>Series #4 · June 14 · 20 players</h3><div class="w">Wilbur Hlay</div><div class="pod">+4.85 · 2nd Tom Stitt (+4.15) · 3rd Bill Steirer (+3.35)</div>
<p>Wilbur Hlay wins it and cashes a skin on top, for a <b>$110 day</b>, the biggest single-event payday of the season.</p></div>

<div class="card ev"><h3>Series #5 · July 19 · 19 players</h3><div class="w">Rich Potts</div><div class="pod">+8.00 · 2nd Adam Costa (+5.88) · 3rd Paul Kametz (+5.64)</div>
<p>Rich Potts goes <b>eight over quota</b> and picks up a skin and a closest-to-the-pin on the 8th. Scott Justus quietly collected two skins in the same round.</p></div>

<div class="card ev"><h3>Series #6 · August 16 · 20 players</h3><div class="w">Dave Sherwin</div><div class="pod">+8.39 · 2nd Bill Steirer (+6.21) · 3rd Jake Knappenberger (+5.46)</div>
<p>Dave Sherwin lights it up at +8.39, the second-best round of the season, and takes the closest-to-the-pin on 8 as a bonus.</p></div>

<div class="card ev"><h3>Series #9 · October 25 · 20 players</h3><div class="w">Evan Lindermuth</div><div class="pod">+9.28 · 2nd BJ Kolonia (+6.58) · 3rd Tom Arnold (+4.90)</div>
<p>The round of the year. Evan&rsquo;s +9.28 is the highest of the season, and he cashed a skin on top of it. Meanwhile Jordan Knappenberger picked up two skins and a <b>$108 day</b>.</p></div>

<div class="card ev"><h3>Series #10 · November 1 · 13 players · The Finale</h3><div class="w">BJ Kolonia</div><div class="pod">+3.65 · 2nd Jordan Knappenberger (+2.77) · 3rd Tom Stitt (+1.69)</div>
<p>Thirteen players and one last shot at the title. BJ Kolonia closes the season with the win and locks up the Overall title. Jordan Knappenberger took <b>three of the six skins</b> for a <b>$93 day</b>, and Evan Lindermuth won both the 8th and the 18th closest-to-the-pin.</p></div>

<h2>Show me the money</h2>
<div class="lede">The season money list: podium, skins, closest-to-the-pin and the Season Pot, all added up. The top six:</div>
<div class="card">
  <table>
    <tr><th>#</th><th>Player</th><th class="r">Events</th><th class="r">Total</th></tr>
    <tr><td>1</td><td><b>Jordan Knappenberger</b></td><td class="r">5</td><td class="r money">$292.00</td></tr>
    <tr><td>2</td><td><b>Bill Steirer</b></td><td class="r">6</td><td class="r money">$270.33</td></tr>
    <tr><td>3</td><td><b>Scott Justus</b></td><td class="r">4</td><td class="r money">$260.29</td></tr>
    <tr><td>4</td><td><b>Rich Potts</b></td><td class="r">5</td><td class="r money">$243.14</td></tr>
    <tr><td>5</td><td><b>BJ Kolonia</b></td><td class="r">6</td><td class="r money">$237.00</td></tr>
    <tr><td>6</td><td><b>Evan Lindermuth</b></td><td class="r">6</td><td class="r money">$199.33</td></tr>
  </table>
</div>
<div class="card">
  <p><b>Jordan Knappenberger is your money-list leader.</b> Six skins, more than anyone in the Series, and a Green-flight silver on top, all in just five events. And hold the phone on Scott Justus: <b>four events played, $260 collected, third on the money list</b>, and not a single podium finish. That is pure skins work. Five of them, in fact. That&rsquo;s efficiency, folks.</p>
</div>

<h2>By the numbers</h2>
<div class="facts">
  <div class="fact"><div class="n">7</div><p><b>Different winners in seven events.</b> Chooch, Adam, Wilbur, Rich Potts, Dave, Evan and BJ each took one. Parity at its finest.</p></div>
  <div class="fact"><div class="n">+9.28</div><p><b>Best round of the season:</b> Evan Lindermuth, Series #9. Next best: Dave Sherwin (+8.39), then Rich Potts (+8.00).</p></div>
  <div class="fact"><div class="n">35</div><p><b>Closest-to-the-pin prizes awarded,</b> and every one of them was claimed. <b>Evan Lindermuth</b> and <b>Rich Potts</b> lead the way with four apiece, and <b>Brian Hager</b>, <b>Dave Sherwin</b> and <b>Mohamed Walli</b> each collected three.</p></div>
  <div class="fact"><div class="n">2×</div><p><b>Two CTPs in one round,</b> twice. Rich Potts won both the 8th and the 18th in Series #9, and Evan Lindermuth did it in the finale.</p></div>
  <div class="fact"><div class="n">6</div><p><b>Skins for Jordan Knappenberger,</b> the Series high, three of them in the finale. Scott Justus had five, Bill Steirer four.</p></div>
  <div class="fact"><div class="n">3</div><p><b>Podium finishes for BJ Kolonia,</b> the most of anyone: third in #3, second in #9, first in #10. He peaked at exactly the right time.</p></div>
  <div class="fact"><div class="n">4</div><p><b>Players who teed it up in all seven events:</b> Rich Penberg, Jeff Rapp, Chooch Wernett and Brian Hager. The iron men of 2026.</p></div>
  <div class="fact"><div class="n">+10.9</div><p><b>Red numbers into black:</b> Tom Arnold went from &minus;6.04 in his first scored event to +4.90 in his last, a podium finish at #9. Tom Stitt went from &minus;7.71 to +1.69, with two podiums along the way (2nd in #4, 3rd in #10).</p></div>
  <div class="fact"><div class="n">22</div><p><b>The biggest field of the year:</b> Series #3 in late May. The finale was the smallest at 13, but, as we saw, quality over quantity.</p></div>
  <div class="fact"><div class="n">$3,000</div><p><b>Total prize money for the season:</b> $2,620 in event pools (131 rounds at $20 a head) plus the $380 Season Pot.</p></div>
</div>

<div class="thanks">
  <h2>Thank you, players</h2>
  <p>None of this happens without you. Every shot, every skin, every argument over a ruling and every laugh at the turn is the Series. Thirty-one of you showed up in 2026, and every one of you made it better.</p>
  <p>Congratulations to BJ, Evan, Rich Penberg, and every winner above. See you next season!</p>

function updateEvtPills(activeBtn) {
  if (!activeBtn) return;
  activeBtn.closest('div').querySelectorAll('button').forEach(b => {

    b.style.background    = on ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.08)';

    b.style.borderColor   = on ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.45)';
  });
}

  const iframe = document.getElementById('groups-iframe');
  const noArchive = document.getElementById('groups-no-archive');
  if (!iframe || !noArchive) return;
  if (archiveFile) {
    iframe.src = '/' + archiveFile + '?embed=1';
    iframe.style.display = 'block';
    noArchive.style.display = 'none';

// Note: the top white nav bar's "⛳ Groupings" link is deliberately NOT touched
// here or in loadEvent() — it's meant to always point at the live/current
// groupings.html regardless of which event pill is selected (Brian's explicit
// call, Dev-63: switching to an old event via the pills should browse that
// event's history, not redirect the general-purpose nav to an archive). Only
// the "⛳ Groups" TAB is event-aware — that's the intended place to reach a
// specific event's archived groupings.
(function syncGroupsOnLoad() {
  loadGroupsTab(_currentEventName);
  const grpTab = document.getElementById("groups-tab");
  if (grpTab) {
    const hasArchive = !!GROUPINGS_ARCHIVE[_currentEventName];
    grpTab.style.opacity = hasArchive ? "1" : "0.45";
    grpTab.title = hasArchive ? "View groupings for " + _currentEventName : "No groupings archive for this event";
    grpTab.style.cursor = hasArchive ? "pointer" : "default";
  }
})();

// Deep-link support (Dev-67) — reads ?event=<name> from the URL and
// switches to that event on load, same as clicking its pill would. Lets
// My History (portal) link directly to a specific series' results instead
// of just birdiefriends.com/results.html, which otherwise only ever shows
// whichever event was "current" at the last publish. Baked into this
// generator template (not just patched onto a single published file) so
// it survives every future publish automatically.
(function syncEventFromUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const requested = params.get('event');
    if (!requested) return;
    if (!ALL_SERIES_DATA?.events?.some(e => e.name === requested)) return; // unknown event — leave the default as-is
    loadEvent(requested);
    document.querySelectorAll('button[onclick*="loadEvent("]').forEach(b => {
      if (b.getAttribute('onclick').includes("loadEvent('" + requested + "')")) updateEvtPills(b);
    });
  } catch(e) { /* fail silently — worst case the page just shows its normal default event */ }
})();

function loadEvent(selectedName) {
  if (!ALL_SERIES_DATA) return;
  const evt = ALL_SERIES_DATA.events.find(e => e.name === selectedName);
  if (!evt) return;
  _currentEventName = selectedName;
  loadGroupsTab(selectedName);
  // Update Groups tab state
  const grpTab = document.getElementById('groups-tab');
  if (grpTab) {
    const hasArchive = !!GROUPINGS_ARCHIVE[selectedName];
    grpTab.style.opacity = hasArchive ? '1' : '0.45';
    grpTab.title = hasArchive ? 'View groupings for ' + selectedName : 'No groupings archive for this event';
    grpTab.style.cursor = hasArchive ? 'pointer' : 'default';
  }

  // Always 2 decimal places — the numbers are the numbers
  function fmtDiff(v) {
    if (v === null || v === undefined) return '—';
    return (v >= 0 ? '+' : '') + v.toFixed(2);
  }

  // Build quota results from saved per-player event records (correct quota, not next-event quota)
  const playerHistory = ALL_SERIES_DATA.playerHistory;
  const scores = evt.scores || {};
  const ctpData = evt.ctp || {};
  const skinWinners = evt.skins || [];
  const skinCounts = {};
  skinWinners.forEach(s => { skinCounts[s.winner] = (skinCounts[s.winner]||0)+1; });
  const ptsToDiff = PTS_TO_DIFF;

  const quotaResults = Object.entries(playerHistory)
    .map(([name, ph]) => {
      const evtRecord = (ph.events||[]).find(e => e.eventName === selectedName);
      if (!evtRecord) return null;
      const total = evtRecord.actual;
      const quota = evtRecord.quota;
      const diff  = quota !== null ? Math.round((total - quota) * 100) / 100 : null;
      return { name, hcp: evtRecord.hcp, tee: evtRecord.tee, quota, total, diff,
               noHcp: evtRecord.noHcp || false };
    })
    .filter(Boolean)
    .sort((a,b) => {
      if (a.diff===null && b.diff===null) return 0;
      if (a.diff===null) return 1;
      if (b.diff===null) return -1;
      return b.diff - a.diff;
    });

  // ── Podium ──
  const medals = ['🥇','🥈','🥉'];
  const top3 = quotaResults.filter(p => p.diff !== null).slice(0,3);
  // Build place labels with tie awareness (T-1, T-2 etc)
  const placeLabels = [];
  let pi = 0;
  while (pi < top3.length) {
    let ti = pi;
    while (ti < top3.length && Math.abs((top3[ti].diff||0) - (top3[pi].diff||0)) < 0.001) ti++;
    const tied = (ti - pi) > 1;
    for (let j = pi; j < ti; j++) placeLabels.push(tied ? `T-${pi+1}` : `${pi+1}`);
    pi = ti;
  }
  document.querySelector('#highlights-podium-card .podium').innerHTML = top3.map((p,i) => `
    <div class="podium-card ${i===0&&placeLabels[0]==='1'?'p1':''}">
      <div class="medal">${placeLabels[i]==='1'?'🥇':placeLabels[i]==='2'?'🥈':placeLabels[i]==='3'?'🥉':placeLabels[i]}</div>
      <div class="pname">${p.name}</div>
      <div class="pscore">${p.total.toFixed(1)} pts · Quota ${p.quota!==null?p.quota.toFixed(1):'—'}</div>
      <div class="pdiff">${p.diff!==null?fmtDiff(p.diff):'—'}</div>
    </div>`).join('');

  // ── Standings ──
  document.querySelector('#tab-standings table tbody').innerHTML = quotaResults.map((p,i) => `
    <tr>
      <td class="rank">${i+1}</td>
      <td class="pname-cell">${p.name}
        <span style="margin-left:6px;font-size:0.65rem;padding:1px 5px;border-radius:10px;
          ${p.tee==='Green'?'background:#e8f5e9;color:#1a6b30':p.tee==='Combo'?'background:#fff3e0;color:#7a4a00':'background:#fff8e1;color:#7a5a00'}"
        >${p.tee}</span>
      </td>
      <td class="r">${p.quota !== undefined && p.quota !== null ? p.quota.toFixed(2) : '—'}</td>
      <td class="r">${p.total.toFixed(1)}</td>
      <td class="r ${p.diff!==null&&p.diff>0?'pos':p.diff!==null&&p.diff<0?'neg':''}">${p.diff!==null?fmtDiff(p.diff):'—'}</td>
    </tr>`).join('');

  // ── vs Par (strokes) ──
  const strokeRows = quotaResults.map(p => {
    const hs = scores[p.name] || [];
    let front=0, back=0;
    hs.slice(0,9).forEach((pts,i)  => { front += BSGC_PARS_DATA[i]   + (ptsToDiff[pts]??2); });
    hs.slice(9,18).forEach((pts,i) => { back  += BSGC_PARS_DATA[i+9] + (ptsToDiff[pts]??2); });
    return { name:p.name, front, back, total:front+back };
  }).sort((a,b) => a.total - b.total);
  document.querySelector('#tab-strokes table tbody').innerHTML = strokeRows.map((p,i) => {
    const fmt = v => v===0?'E':v>0?`+${v}`:`${v}`;
    const cls = v => v>0?'neg':v<0?'pos':'';
    const vf=p.front-36, vb=p.back-35, vt=p.total-71;
    return `<tr>
      <td class="rank">${i+1}</td>
      <td class="pname-cell">${p.name}</td>
      <td class="r"><span class="${cls(vf)}">${p.front} (${fmt(vf)})</span></td>
      <td class="r"><span class="${cls(vb)}">${p.back} (${fmt(vb)})</span></td>
      <td class="r" style="font-weight:600"><span class="${cls(vt)}">${p.total} (${fmt(vt)})</span></td>
    </tr>`;
  }).join('');

  // ── Birdies ──
  const birdieData = quotaResults.map(p => {
    const hs = scores[p.name] || [];
    const birdies = hs.filter(s => s===4).length;
    const eagles  = hs.filter(s => s===6).length;
    return { name:p.name, birdies, eagles, total:birdies+eagles };
  }).sort((a,b) => b.total-a.total||b.eagles-a.eagles).filter(p => p.total>0);
  document.querySelector('#tab-birdies table tbody').innerHTML = birdieData.length===0
    ? '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:12px">No birdies or eagles recorded</td></tr>'
    : birdieData.map((p,i) => `<tr>
        <td class="rank">${i+1}</td>
        <td class="pname-cell">${p.name}</td>
        <td class="r" style="color:#3B6D11;font-weight:600">${p.eagles>0?p.eagles:'—'}</td>
        <td class="r" style="color:#085041;font-weight:600">${p.birdies>0?p.birdies:'—'}</td>
        <td class="r" style="font-weight:700">${p.total}</td>
      </tr>`).join('');

  // ── Skins ──
  const skinsCard = document.querySelector('#highlights-skins-card');
  skinsCard.querySelector('.card-label').textContent = skinWinners.length + ' Skin' + (skinWinners.length!==1?'s':'') + ' Won';
  const skinBody = skinsCard.querySelector('.skins-body') || (() => {
    const d = document.createElement('div'); d.className='skins-body'; skinsCard.appendChild(d); return d;
  })();
  skinBody.innerHTML = skinWinners.length===0
    ? '<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:12px">No outright skins — all holes tied</div>'
    : skinWinners.map(s => `
        <div class="skin-row">
          <div class="hole-badge">#${s.hole}</div>
          <div class="skin-info">
            <div class="skin-name">${s.winner}</div>
            <div class="skin-detail">Outright winner · ${s.pts} pts</div>
          </div>
        </div>`).join('');

  // ── CTP ──
  const ctpHoles = [3,8,10,15,18];
  document.querySelector('#highlights-ctp-card').querySelectorAll('.ctp-row').forEach((row,i) => {
    const h = ctpHoles[i];
    const w = ctpData && ctpData[h];
    row.querySelector('.skin-name').textContent = w || '—';
  });

  // ── Money ──
  // Historical events use their frozen payoutSnapshot (see saveEventToSeries())
  // instead of recalculating with whatever formula is live today — same fix as
  // the server-side render above, needed here too since switching event pills
  // client-side re-renders this card from ALL_SERIES_DATA.
  let moneyRows;
  if (Array.isArray(evt.payoutSnapshot)) {
    moneyRows = evt.payoutSnapshot.filter(p => p.total > 0).sort((a,b) => b.total - a.total);
  } else {
    const playerCount = quotaResults.length;
    const totalPool = playerCount * 20;
    // ── Proportional payout structure (Dev-62) — mirrors calculatePayout() above. Update both together. ──
    const PODIUM_PCT = 0.20;
    const CTP_PCT = 0.15;
    const PODIUM_WEIGHTS = [2, 1, 0.5];
    const round5 = x => Math.round(x / 5) * 5;
    const weightSum = PODIUM_WEIGHTS.reduce((a,b)=>a+b,0);
    let QUOTA_PRIZES = PODIUM_WEIGHTS.map(w => round5(totalPool * PODIUM_PCT * w / weightSum));
    let CTP_PRIZE = round5((totalPool * CTP_PCT) / ctpHoles.length);
    const nonSkinMax = QUOTA_PRIZES.reduce((a,b)=>a+b,0) + CTP_PRIZE * ctpHoles.length;
    if (nonSkinMax > totalPool * 0.9) {
      const scale = (totalPool * 0.9) / nonSkinMax;
      QUOTA_PRIZES = QUOTA_PRIZES.map(x => round5(x * scale));
      CTP_PRIZE = round5(CTP_PRIZE * scale);
    }
    const payouts = {};
    quotaResults.forEach(p => { payouts[p.name] = {quota:0, skin:0, ctp:0}; });
    let placeIdx=0;
    while (placeIdx < Math.min(3, quotaResults.length)) {
      const thisDiff = quotaResults[placeIdx].diff;
      const tiedGroup = [];
      let scan = placeIdx;
      while (scan < quotaResults.length && Math.abs((quotaResults[scan].diff||0) - (thisDiff||0)) < 0.001) {
        tiedGroup.push(quotaResults[scan].name); scan++;
      }
      let prizeSum = 0;
      for (let k=placeIdx; k<Math.min(scan,3); k++) prizeSum += QUOTA_PRIZES[k];
      const share = Math.floor(prizeSum / tiedGroup.length); // floor per tie rule spec
      tiedGroup.forEach(n => { if (payouts[n]) payouts[n].quota = share; });
      placeIdx = scan;
    }
    ctpHoles.forEach(h => {
      const winner = ctpData && ctpData[h] ? ctpData[h] : '';
      if (winner) { if (payouts[winner]) payouts[winner].ctp += CTP_PRIZE; else payouts[winner]={quota:0,skin:0,ctp:CTP_PRIZE}; }
    });
    const quotaPaid = Object.values(payouts).reduce((s,p)=>s+p.quota,0);
    const ctpPaid   = Object.values(payouts).reduce((s,p)=>s+p.ctp,0);
    const skinPool  = totalPool - quotaPaid - ctpPaid;
    const totalSkins = skinWinners.length;
    const perSkin = totalSkins > 0 ? Math.floor(skinPool / totalSkins) : 0;
    if (totalSkins > 0) {
      Object.entries(skinCounts).forEach(([name,count]) => {
        if (payouts[name]) payouts[name].skin += perSkin * count;
        else payouts[name] = {quota:0, skin: perSkin*count, ctp:0};
      });
    }
    moneyRows = Object.entries(payouts)
      .map(([name,p]) => ({name, ...p, total:p.quota+p.skin+p.ctp}))
      .filter(p => p.total > 0)
      .sort((a,b) => b.total - a.total);
  }
  document.querySelector('#highlights-money-card table tbody').innerHTML = moneyRows.length===0
    ? '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:12px">No payouts recorded</td></tr>'
    : moneyRows.map((p,i) => `<tr>
        <td class="rank">${i+1}</td>
        <td class="pname-cell">${p.name}</td>
        <td class="r" style="color:var(--muted)">${p.quota>0?'$'+p.quota.toFixed(2):'—'}</td>
        <td class="r" style="color:var(--muted)">${p.skin>0?'$'+p.skin.toFixed(2):'—'}</td>
        <td class="r" style="color:var(--muted)">${p.ctp>0?'$'+p.ctp.toFixed(2):'—'}</td>
        <td class="r" style="font-weight:700;color:var(--green)">$${p.total.toFixed(2)}</td>
      </tr>`).join('');

  // Update header title/date + browser tab title — these never had the fix
  // wired up (title had no id at all; date's id didn't exist in the markup
  // until now), so switching event pills updated every tab's content but left
  // the header frozen on whatever was server-rendered at page load. Found by
  // Brian clicking a pill and watching the title stay put.
  const dateStr = evt.date
    ? new Date(evt.date + 'T00:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})
    : '';
  const hdrTitle = document.getElementById('hdr-event-title');
  if (hdrTitle) hdrTitle.textContent = selectedName;
  const hdrDate = document.getElementById('hdr-event-date');
  if (hdrDate) hdrDate.textContent = dateStr;
  document.title = selectedName + ' — BirdieFriends Golf';

  // Reset to highlights tab
  switchTab('highlights', document.querySelector('.tabs .tab'));
}

function sign(v) { return v >= 0 ? '+' : ''; }
function fmt2(v) { return v === null || v === undefined ? '—' : (sign(v) + v.toFixed(2)); }
function teeClass(t) { return 'tee-badge tee-' + t; }

function toggleSection(id) {
  const body = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  const open = body.classList.toggle('open');
  if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
}

function toggleEventDetail(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function showPlayer(name) {
  const wrap = document.getElementById('player-content');
  if (!name) { wrap.innerHTML = ''; wrap.classList.add('hidden'); return; }
  const p = ALL_PLAYER_DATA[name];
  if (!p) { wrap.innerHTML = ''; wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');

  // ── NARRATIVE SUMMARY ──────────────────────────────────────────────────
  const evtWord = n => n === 1 ? '1 event' : n + ' events';
  let narrative = '';

  if (p.scorablePlayed === 0) {
    // Only baseline event played
    narrative = `<p>${p.name} has played 1 event (baseline only). No series score has been calculated yet. A starting quota will be assigned for the next event based on the baseline score.</p>`;
  } else {
    const scoreStr = fmt2(p.seriesScore);
    const rankStr  = p.qualifies
      ? `ranked <strong>#${p.overallRank} overall</strong> and <strong>#${p.flightRank} in the ${p.seriesFlight || p.tee} flight</strong>`
      : `not yet qualified for the series championship (minimum 4 events required)`;
    const totalPlayed = p.played || p.scorablePlayed;
    const baselineNote = (p.hasRetroE1 || totalPlayed > p.scorablePlayed) ? ' (including 1 baseline event)' : '';
    const eventsStr = totalPlayed === 1
      ? `1 event${baselineNote}`
      : `${totalPlayed} events${baselineNote}`;
    const scoreDir = p.seriesScore > 0
      ? `above quota by ${Math.abs(p.seriesScore).toFixed(2)} points on average`
      : p.seriesScore < 0
      ? `below quota by ${Math.abs(p.seriesScore).toFixed(2)} points on average`
      : `exactly at quota`;

    narrative = `<p>${p.name} has played ${eventsStr} in the ${p.seriesFlight || p.tee} flight and is ${rankStr}.</p>
      <p>Across those events, performance has been ${scoreDir}. The series score of <strong>${scoreStr}</strong> reflects the best 4 results${p.calcEvts.length > 4 ? ', with remaining events averaged in' : ''}.</p>`;

    if (!p.qualifies) {
      const needed = 4 - p.scorablePlayed;
      narrative += `<p>${needed} more qualifying event${needed !== 1 ? 's' : ''} needed to be eligible for the series championship payout.</p>`;
    }
    if (p.hasRetroE1) {
      narrative += `<p style="font-size:0.85rem;color:var(--text-muted);margin-top:6px">~ Event 1 baseline score has been retroactively included in the series calculation, using a quota averaged from your later events.</p>`;
    }
  }

      <div class="event-row" onclick="toggleEventDetail('${detailId}')">

          <div class="event-row-name">Event ${evtNum}: ${evt.eventName}
