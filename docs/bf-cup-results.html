<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 BirdieFriends Cup · Results</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a1f44;--navy2:#10306a;--navy3:#183f82;--red:#d6203a;--redlt:#ff6b78;--blue:#2f6fe0;--bluelt:#7fb2ff;--white:#fff;--dim:rgba(255,255,255,.68);--faint:rgba(255,255,255,.16);--good:#7fd69a;--warn:#ffd36b}
body{margin:0;background:var(--navy) radial-gradient(ellipse at 50% -10%,rgba(47,111,224,.35),transparent 60%);color:var(--white);font-family:'DM Sans',sans-serif;line-height:1.4;padding-bottom:60px}
h1,h2{font-family:'Baloo 2',sans-serif;margin:0}
.mock{background:#ffd36b;color:#3a2a00;text-align:center;font-size:.76rem;padding:6px 10px;font-weight:600}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fff 28px 56px)}
.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 16px}
.nav a{padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:700;text-decoration:none;color:#fff;background:var(--navy2);border:1px solid var(--faint)}
.hero{text-align:center;padding:14px 16px 20px;border-bottom:2px solid #fff;max-width:980px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#fff;font-weight:700}
.hero h1{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;line-height:1;margin-top:8px}
.hero .sub{color:var(--dim);font-size:.92rem;margin-top:8px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;max-width:560px;margin:20px auto 0}
.team{background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:12px 6px}
.team.cred{border-top:5px solid var(--red)}.team.cblue{border-top:5px solid var(--blue)}
.team small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.team b{display:block;font-family:'Baloo 2',sans-serif;font-size:2.9rem;line-height:1;margin-top:2px}
.team.cred b{color:var(--redlt)}.team.cblue b{color:var(--bluelt)}
.team.win{box-shadow:0 0 0 2px #fff;background:var(--navy3)}
.vs{font-size:.7rem;letter-spacing:.2em;color:var(--dim)}
.cap{font-size:.82rem;color:var(--dim);margin-top:12px}.cap b{color:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--navy);border-bottom:1px solid var(--faint)}
.tab{flex:none;padding:7px 15px;border-radius:20px;font-size:.82rem;font-weight:700;border:1px solid var(--faint);background:var(--navy2);color:#fff;cursor:pointer;font-family:inherit}
.tab.on{background:var(--red);border-color:var(--red)}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.pane{display:none}.pane.on{display:block}
h2{font-weight:800;font-size:1.5rem;margin:24px 0 2px}
.kicker{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--redlt);font-weight:700}
.lede{color:var(--dim);margin-bottom:12px;font-size:.92rem}
.card{background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card p+p{margin-top:9px}
.bcast{border-left:5px solid var(--red)}
.bcast .mic{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--redlt);font-weight:700}
.bcast .head{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.55rem;line-height:1.15;margin:4px 0 8px}
.bcast .tag{font-size:.7rem;color:var(--dim);margin-top:10px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat3 div{background:var(--navy2);border:1px solid var(--faint);border-radius:10px;text-align:center;padding:10px 4px}
.stat3 b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.4rem;line-height:1.1}
.stat3 span{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sess{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:14px 0 6px}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:.86rem}
.m .side{line-height:1.3;border-left:4px solid var(--red);padding-left:8px}
.m .side.b{text-align:right;border-left:0;border-right:4px solid var(--blue);padding:0 8px 0 0}
.m .res{font-weight:800;font-size:.78rem;text-align:center;padding:4px 9px;border-radius:10px;white-space:nowrap}
.m .res.j{background:var(--red);color:#fff}.m .res.n{background:var(--blue);color:#fff}.m .res.h{background:var(--navy3);color:#fff}
.m .w{font-weight:800}
.pts{font-size:.7rem;color:var(--dim);display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--navy3);color:#fff;text-align:left;padding:8px 10px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid var(--faint)}
td.r,th.r{text-align:right}
.money{font-family:'SF Mono',Menlo,Consolas,monospace;font-weight:700;color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.74rem;background:var(--navy3);border:1px solid var(--faint);color:#fff;border-radius:12px;padding:3px 10px;font-weight:600}
.day{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--redlt);font-weight:700;margin:16px 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph{aspect-ratio:1;background:linear-gradient(135deg,var(--navy3),var(--navy2));border:1px solid var(--faint);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;position:relative}
.ph small{position:absolute;left:4px;bottom:3px;font-size:.56rem;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}
.ph.v::after{content:"▶";position:absolute;right:5px;top:3px;font-size:.7rem;color:#fff;text-shadow:0 0 3px #000}
.dl{display:block;text-align:center;margin:22px auto 0;background:var(--red);color:#fff;font-weight:700;padding:11px 22px;border-radius:24px;font-size:.9rem;width:fit-content;border:0;font-family:inherit}
.foot{text-align:center;color:var(--dim);font-size:.74rem;margin-top:18px}
@media(max-width:480px){.m{font-size:.8rem;padding:9px 8px}}
.empty{color:var(--dim);text-align:center;padding:24px 0}
.m{cursor:default}.mseg{display:block;font-size:.7rem;color:var(--dim)}
.m .res small{display:block;font-weight:600;font-size:.62rem;opacity:.85}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.note{font-size:.88rem;border-left:3px solid var(--faint);padding:2px 0 2px 10px;margin-top:8px;color:var(--dim)}.note b{color:#fff}
.err{background:#5a1a24;border:1px solid var(--red);border-radius:10px;padding:10px 14px;margin:14px 0}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>
<div class="stripes"></div>
<div class="nav"><a href="/portal.html">← Portal</a><a href="#" id="liveLink">Live</a></div>
<div id="app"><div class="empty">Loading the Cup…</div></div>
<script src="bf_engine.js?v=1.47.3"></script>
<script>
(function () {
  var WORKER = 'https://bf-experiences.birdiefriends01.workers.dev';
  var qs = new URLSearchParams(location.search);
  var E = window.BFEngine, app = document.getElementById('app');
  var cfg = null, EVENT = qs.get('event') || '', mems = [], notes = [], story = null, tab = '';
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function usd(n) { n = Number(n) || 0; return '$' + (Math.round(n * 100) % 100 ? n.toFixed(2) : String(Math.round(n))); }
  function pts(n) { var w = Math.floor(n), h = n - w >= 0.5; return (w || !h ? w : '') + (h ? '\u00bd' : ''); }
  function sideOf(k) { return (cfg.sides || []).filter(function (s) { return s.key === k; })[0] || { key: k, name: k }; }
  function sideName(k) { return sideOf(k).name || 'Side ' + k; }
  function cls(k) { var i = (cfg.sides || []).map(function (s) { return s.key; }).indexOf(k), sd = sideOf(k); return sd.color === 'blue' ? 'cblue' : sd.color === 'red' ? 'cred' : (i ? 'cblue' : 'cred'); }
  function jget(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }

  function load() {
    var p = EVENT ? Promise.resolve(EVENT) : jget(WORKER + '/bfe/cup-live').then(function (j) { var e = (j.events || [])[0]; if (!e) throw new Error('No Cup found'); return e.event_name; });
    return p.then(function (name) {
      EVENT = name;
      return jget(WORKER + '/bfe/cup?event=' + encodeURIComponent(name) + '&_=' + Date.now());
    }).then(function (j) {
      cfg = j.config;
      var memName = qs.get('mem_event') || EVENT;
      return Promise.all([
        jget(WORKER + '/bfe/memories?event=' + encodeURIComponent(memName)).then(function (r) { mems = r.memories || []; }).catch(function () {}),
        jget(WORKER + '/bfe/memories/notes?event=' + encodeURIComponent(memName)).then(function (r) { notes = r.notes || []; }).catch(function () {}),
        fetch('bf-cup-story.json?_=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) { story = s; }).catch(function () {})
      ]);
    });
  }

  // ── commentator: written from the standings (figures only ever come from the Cup record) ──
  function matchLine(r, m, ix) {
    var segs = m.segments, names = function (i) { return m.sides[i].players.map(function (p) { return p.split(' ').slice(-1)[0]; }).join(' and '); };
    var bits = segs.filter(function (s) { return s.decided; });
    var tot = {}; m.sides.forEach(function (s) { tot[s.side] = m.points[s.side] || 0; });
    return { a: names(0), b: names(1), ka: m.sides[0].side, kb: m.sides[1].side, pa: tot[m.sides[0].side], pb: tot[m.sides[1].side], done: m.done, segs: bits };
  }
  function autoStory(st) {
    var keys = (cfg.sides || []).map(function (s) { return s.key; }), A = keys[0], B = keys[1];
    var out = { head: '', paras: [], days: [], chips: [], mic: 'The Broadcast' };
    var pa = st.points[A], pb = st.points[B], lead = pa === pb ? null : (pa > pb ? A : B), trail = lead === A ? B : A;
    var played = st.rounds.some(function (r) { return r.matches.some(function (m) { return m.segments.some(function (s) { return s.thru > 0; }); }); });
    if (!played) { out.head = 'The first tee shot is still to come'; out.paras.push('Sixteen players, two teams, and nothing on the board yet. ' + sideName(A) + ' and ' + sideName(B) + ' open at ' + pts(pa) + ' apiece. The call from the booth starts the moment someone holds a card.'); return out; }
    if (st.state === 'final' && st.winner) {
      out.head = sideName(st.winner) + ' take the Cup, ' + pts(st.points[st.winner]) + ' to ' + pts(st.points[st.winner === A ? B : A]);
      out.mic = 'The Broadcast \u00b7 Final';
      out.paras.push('And that is the ball game! ' + sideName(st.winner) + ' finish with ' + pts(st.points[st.winner]) + ' points to ' + pts(st.points[st.winner === A ? B : A]) + ' and the 2026 BirdieFriends Cup is theirs.');
    } else if (st.shared) {
      out.head = 'All square, the Cup is shared at ' + pts(pa);
      out.paras.push('Nobody blinks. Both sides finish on ' + pts(pa) + ' and the Cup is shared.');
    } else {
      out.head = lead ? sideName(lead) + ' lead ' + pts(st.points[lead]) + ' to ' + pts(st.points[trail]) : 'All square at ' + pts(pa);
      out.mic = 'The Broadcast \u00b7 Live';
      out.paras.push((lead ? sideName(lead) + ' hold a ' + pts(st.points[lead]) + '-' + pts(st.points[trail]) + ' lead' : 'It is all square at ' + pts(pa) + ' apiece') + ' with ' + pts(st.open * 1) + ' point' + (st.open === 1 ? '' : 's') + ' still to be decided. ' + (st.clinched ? sideName(st.clinched) + ' have already clinched.' : 'Needs ' + pts(st.target) + ' to win the Cup.'));
    }
    var best = null, swing = null;
    st.rounds.forEach(function (r, ri) {
      var ra = 0, rb = 0, lines = [];
      r.matches.forEach(function (m, mi) {
        var L = matchLine(r, m, mi); ra += L.pa; rb += L.pb; lines.push(L);
        m.segments.forEach(function (s) { if (s.decided && s.winner && s.text && /^\d/.test(s.text)) { var mg = parseInt(s.text, 10); if (!best || mg > best.mg) best = { mg: mg, side: s.winner, text: s.text, who: s.winner === L.ka ? L.a : L.b, round: r.name }; } });
      });
      var done = r.matches.filter(function (m) { return m.done; }).length;
      if (!r.matches.length) return;
      var d = r.name + ': ' + sideName(A) + ' ' + pts(ra) + ', ' + sideName(B) + ' ' + pts(rb) + ' from ' + done + ' of ' + r.matches.length + ' finished matches.';
      var tops = lines.filter(function (l) { return l.done && l.pa !== l.pb; }).sort(function (x, y) { return Math.abs(y.pa - y.pb) - Math.abs(x.pa - x.pb); })[0];
      if (tops) d += ' ' + (tops.pa > tops.pb ? tops.a : tops.b) + ' were the class of the round (' + pts(Math.max(tops.pa, tops.pb)) + ' to ' + pts(Math.min(tops.pa, tops.pb)) + ').';
      out.days.push({ mic: r.name, text: d });
    });
    if (best) out.paras.push('The biggest finish came from ' + best.who + ', who closed a match ' + best.text + ' in ' + best.round + '.');
    var mv = null; try { mv = E.cupMoneyView(cfg); } catch (e) {}
    if (mv && mv.players.length && mv.players[0].won > 0) { out.chips.push('Top earner: ' + mv.players[0].player + ' ' + usd(mv.players[0].won)); }
    if (best) out.chips.push('Biggest win: ' + best.who + ' ' + best.text);
    out.chips.push('Points on the board: ' + pts(pa + pb) + ' of ' + pts(st.total));
    return out;
  }

  // ── renderers ──
  function renderStory(st) {
    var s = story && story.head ? story : autoStory(st), o = '';
    var byHand = story && story.head;
    o += '<h2>Ladies and gentlemen&hellip;</h2><div class="lede">' + (byHand ? 'The call from the booth.' : 'The call from the booth, read off the scorecards as they stand.') + '</div>';
    o += '<div class="card bcast"><div class="mic">\ud83c\udf99 ' + esc(s.mic || 'The Broadcast') + '</div><div class="head">' + esc(s.head) + '</div>' + (s.paras || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    if ((s.days || []).length) { o += '<div class="kicker" style="margin-top:14px">Day by day</div>'; s.days.forEach(function (d) { o += '<div class="card bcast"><div class="mic">\ud83c\udf99 ' + esc(d.mic) + '</div><p>' + esc(d.text) + '</p></div>'; }); }
    if ((s.chips || []).length) o += '<div class="kicker" style="margin-top:14px">Moments</div><div class="card"><div class="chips">' + s.chips.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div></div>';
    return o;
  }
  function driveTxt(ri, m) {                                   // Greensomes: how many times each partner's drive was used
    var rd = cfg.rounds[ri], raw = (rd.matches || []).filter(function (x) { return x.key === m.key; })[0], out = '';
    if (!raw) return '';
    (rd.segments || []).filter(function (sg) { return sg.format === 'altshot'; }).forEach(function (sg) {
      var st = E.cupDriveStatus(cfg, rd, raw, sg); if (!st.sides.some(function (sd) { return sd.logged; })) return;
      out += '<span class="mseg">Drives used: ' + st.sides.map(function (sd) { return sd.players.map(function (p) { return esc(p.split(' ').slice(-1)[0]) + ' ' + sd.counts[p]; }).join(', '); }).join(' | ') + ' (each needs ' + st.min + ')</span>';
    });
    return out;
  }
  function renderRound(st, ri) {
    var r = st.rounds[ri], o = '<h2>' + esc(r.name) + '</h2>';
    var segs = (cfg.rounds[ri].segments || []).map(function (sg) { return (E.CUP_FORMATS[sg.format] || {}).label || sg.format; }).join(' + ');
    o += '<div class="lede">' + esc(segs) + '. ' + r.matches.length + ' match' + (r.matches.length === 1 ? '' : 'es') + '.</div>';
    if (!r.matches.length) return o + '<div class="empty">Matches are not drawn yet.</div>';
    var nums = E.cupMatchNumbers(cfg);
    r.matches.forEach(function (m) {
      var ka = m.sides[0].side, kb = m.sides[1].side, pa = m.points[ka] || 0, pb = m.points[kb] || 0;
      var chip = !m.segments.some(function (s) { return s.thru > 0 || s.decided; }) ? '<span class="res h">Not started</span>' : (m.done ? (pa === pb ? '<span class="res h">' + pts(pa) + ' \u2013 ' + pts(pb) + '</span>' : '<span class="res ' + (pa > pb ? 'j' : 'n') + '">' + esc(sideName(pa > pb ? ka : kb)).toUpperCase() + ' ' + pts(Math.max(pa, pb)) + '</span>') : '<span class="res h"><span class="live"></span>LIVE</span>');
      var segTxt = m.segments.map(function (s) { return esc(s.label) + ' ' + esc(s.decided ? (s.winner ? sideName(s.winner) + ' ' + s.text : s.text) : s.text || ''); }).join(' \u00b7 ');
      o += '<div class="sess">Match ' + (nums[r.key + '|' + m.key] || '') + '</div><div class="m"><div class="side ' + cls(ka) + '" style="border-left-color:var(--' + (cls(ka) === 'cred' ? 'red' : 'blue') + ')"><span class="w">' + esc(m.sides[0].players.join(' / ')) + '</span></div>' + chip + '<div class="side b" style="border-right-color:var(--' + (cls(kb) === 'cred' ? 'red' : 'blue') + ')">' + esc(m.sides[1].players.join(' / ')) + '</div></div><div class="pts" style="margin:-4px 0 6px 4px">' + segTxt + driveTxt(ri, m) + '</div>';
    });
    return o;
  }
  function renderMoney() {
    var mv; try { mv = E.cupMoneyView(cfg); } catch (e) { mv = null; }
    if (!mv || !mv.rounds.length) return '<h2>Money</h2><div class="empty">No games are set for this Cup.</div>';
    var o = '<h2>Money</h2><div class="lede">Closest to the pin and skins, from the Cup scores.' + (mv.rounds.some(function (r) { return !r.frozen; }) ? ' Live until the host closes each round.' : '') + '</div>';
    mv.rounds.forEach(function (r) {
      var res = r.result, rows = [];
      o += '<div class="card"><div class="kicker">' + esc(r.name) + (r.frozen ? ' \u00b7 final' : r.expected ? ' \u00b7 not started' : ' \u00b7 live') + '</div>';
      if (res.cttp && res.cttp.holes && res.cttp.holes.length) {
        o += '<table style="margin-top:8px"><tr><th>Closest to the pin</th><th>Hole</th><th class="r">Paid</th></tr>' + res.cttp.holes.map(function (h) { return '<tr><td>' + (h.player ? esc(h.player) : '\u2014') + '</td><td>' + h.hole + '</td><td class="r money">' + (h.player ? usd(h.paid) : 'open') + '</td></tr>'; }).join('') + '</table>';
      }
      if (res.skins) {
        var won = res.skins.won || [];
        o += '<table style="margin-top:10px"><tr><th>Skins \u00b7 pot ' + usd(res.skins.pot) + '</th><th>Hole</th><th class="r">Paid</th></tr>' + (won.length ? won.map(function (w) { return '<tr><td>' + esc(w.player) + '</td><td>' + w.hole + '</td><td class="r money">' + usd(res.skins.per_skin) + '</td></tr>'; }).join('') : '<tr><td colspan="3">No skins won yet</td></tr>') + '</table>';
      }
      o += '</div>';
    });
    var earners = {}; mv.rounds.forEach(function (r) { ((r.result && r.result.payouts) || []).forEach(function (p) { if (Number(p.total) - Number(p.given_back || 0) > 0) earners[p.player] = true; }); });
    if (mv.players.some(function (p) { return earners[p.player]; })) o += '<div class="card"><div class="kicker">Weekend winnings</div><table style="margin-top:8px"><tr><th>Player</th><th class="r">Won</th></tr>' + mv.players.filter(function (p) { return earners[p.player]; }).map(function (p) { return '<tr><td>' + esc(p.player) + '</td><td class="r money">' + usd(p.won) + '</td></tr>'; }).join('') + '</table></div>';
    return o;
  }
  function renderMem() {
    var o = '<h2>Memories</h2><div class="lede">Everything captured from the rail over the weekend, in the order it happened.</div>';
    if (!mems.length && !notes.length) return o + '<div class="empty">No photos or videos yet. Capture from the rail on any BF Cup card and they land here.</div>';
    var groups = {}, order = [];
    mems.forEach(function (m) { var k = m.round_name || 'Weekend'; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(m); });
    order.forEach(function (k) {
      o += '<div class="day">' + esc(k) + '</div><div class="grid">' + groups[k].map(function (m) {
        var src = WORKER + '/bfe/memories/serve/' + m.id, t = m.captured_at ? new Date(String(m.captured_at).replace(' ', 'T') + (/[zZ+]/.test(m.captured_at) ? '' : 'Z')) : null;
        var lab = t && !isNaN(t) ? t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
        return '<a class="ph" href="' + src + '" target="_blank" rel="noopener">' + (m.media_type === 'video' ? '<video src="' + src + '#t=0.1" preload="metadata" muted playsinline></video>' : '<img loading="lazy" src="' + src + '" alt="">') + (lab ? '<small>' + esc(lab) + '</small>' : '') + '</a>';
      }).join('') + '</div>';
    });
    if (notes.length) o += '<div class="card" style="margin-top:12px"><div class="kicker">Notes from the players</div>' + notes.map(function (n) { return '<div class="note">' + esc(n.note_text || n.text || n.note || '') + (n.captured_by || n.author ? ' <b>\u2014 ' + esc(n.captured_by || n.author) + '</b>' : '') + '</div>'; }).join('') + '</div>';
    return o + '<button class="dl" id="dl">\ud83d\udcbe Download the results</button>';
  }

  function render() {
    var st = E.cupLiveStandings(cfg), keys = (cfg.sides || []).map(function (s) { return s.key; }), A = keys[0], B = keys[1];
    var winKey = st.state === 'final' ? st.winner : null;
    var tabs = [['story', 'The Story']].concat(cfg.rounds.map(function (r, i) { return ['r' + i, r.name || ('Round ' + (i + 1))]; })).concat([['money', 'Money'], ['mem', 'Memories']]);
    if (!tab) tab = 'story';
    var o = '<div class="hero"><div class="eyebrow">' + esc(cfg.venue || cfg.course || 'BirdieFriends') + '</div><h1>' + esc(cfg.title || EVENT) + '</h1><div class="sub">' + esc(sideName(A)) + ' vs ' + esc(sideName(B)) + '</div>'
      + '<div class="score"><div class="team ' + cls(A) + (winKey === A ? ' win' : '') + '"><small>' + esc(sideName(A)) + '</small><b>' + pts(st.points[A]) + '</b></div><div class="vs">' + (st.state === 'final' ? 'FINAL' : '<span class="live"></span>LIVE') + '</div><div class="team ' + cls(B) + (winKey === B ? ' win' : '') + '"><small>' + esc(sideName(B)) + '</small><b>' + pts(st.points[B]) + '</b></div></div>'
      + '<div class="cap">' + (winKey ? '\ud83c\udfc6 Cup holders: <b>' + esc(sideName(winKey)) + '</b>' : st.shared ? 'Cup shared' : st.clinched ? '<b>' + esc(sideName(st.clinched)) + '</b> have clinched the Cup' : pts(st.target) + ' points wins the Cup') + '</div></div>';
    o += '<div class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (t[0] === tab ? ' on' : '') + '" data-t="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('') + '</div><div class="wrap">';
    o += tab === 'story' ? renderStory(st) : tab === 'money' ? renderMoney() : tab === 'mem' ? renderMem() : renderRound(st, parseInt(tab.slice(1), 10));
    o += '<div class="foot">BirdieFriends \u00b7 ' + esc(EVENT) + '</div></div>';
    app.innerHTML = o;
    document.title = (cfg.title || EVENT) + ' \u00b7 Results';
    var ll = document.getElementById('liveLink'); if (ll) ll.href = 'bf-cup-draft.html?event=' + encodeURIComponent(EVENT);
    var dl = document.getElementById('dl');
    if (dl) dl.addEventListener('click', function () {
      var data = { event: EVENT, standings: st, money: (function () { try { return E.cupMoneyView(cfg); } catch (e) { return null; } })(), memories: mems.map(function (m) { return { id: m.id, round: m.round_name, type: m.media_type, by: m.captured_by, url: WORKER + '/bfe/memories/serve/' + m.id }; }) };
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); a.download = 'bf-cup-results.json'; a.click();
    });
  }
  app.addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (!b) return; tab = b.getAttribute('data-t'); render(); window.scrollTo(0, 0); });
  load().then(render).catch(function (e) { app.innerHTML = '<div class="wrap"><div class="err">Could not load the Cup results (' + esc(e.message) + '). Try again in a moment.</div></div>'; });
  window.__cupResults = { render: render };
})();
</script>
