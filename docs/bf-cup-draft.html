<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BF Cup Draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{--lm-a:#d6203a;--lm-b:#2f6fe0;--lm-card:#10306a;--lm-card2:#183f82;--lm-text:#fff;--lm-ink:#0a1f44;--navy:#0a1f44;--navy2:#10306a;--navy3:#183f82;--accent:#d6203a;--red:#d6203a;--redlt:#ff6b78;--blue:#2f6fe0;--bluelt:#7fb2ff;--gold:#ffffff;--white:#ffffff;--dim:rgba(255,255,255,.68);--faint:rgba(255,255,255,.16);--good:#7fd69a;--warn:#ffd36b;--bad:#ff9a8a}
body{margin:0;background:var(--navy) radial-gradient(ellipse at 50% -10%,rgba(47,111,224,.35),transparent 60%);color:var(--white);font-family:'DM Sans',sans-serif;line-height:1.35}
.page{max-width:980px;margin:0 auto;padding:0 16px 90px}
h1,h2{font-family:'Baloo 2',sans-serif;margin:0}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fff 28px 56px);margin:0 -16px}
.hero{text-align:center;padding:22px 0 14px;border-bottom:2px solid #fff}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#fff;font-weight:700}
.hero h1{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;line-height:1}
.banner{margin:14px 0;padding:10px 14px;border-radius:10px;background:var(--navy2);border:1px solid var(--faint);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.live{border-color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.card{background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:14px;margin:12px 0}
.meter{position:sticky;top:0;z-index:5;background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:12px 14px;margin:12px 0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mhead,.mrow{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:center;text-align:center}
.mhead{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:4px}
.mrow{font-size:.95rem;padding:3px 0;border-top:1px solid var(--faint)}
.mrow .lab{color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.mrow .win{font-weight:800}.mrow .win.cred{color:var(--redlt)}.mrow .win.cblue{color:var(--bluelt)}
.mhead .cred{color:var(--redlt)}.mhead .cblue{color:var(--bluelt)}
.verdict{margin-top:8px;text-align:center;font-weight:700;font-size:.92rem}
.v-even{color:var(--good)}.v-close{color:var(--warn)}.v-tilted{color:var(--bad)}.v-unknown{color:var(--dim)}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.team h2{font-size:1.15rem;margin-bottom:6px}.card.team.cred{border-top:5px solid var(--red)}.card.team.cblue{border-top:5px solid var(--blue)}
.cred .slot{border-left:4px solid var(--red)}.cblue .slot{border-left:4px solid var(--blue)}
.slot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;padding:6px 8px;border-radius:8px;background:var(--navy3);margin:4px 0;font-size:.92rem}
.slot.cap{border:1px solid var(--gold)}
.slot.new{animation:pop 1.6s ease-out}
@keyframes pop{0%{background:#fff}100%{background:var(--navy3)}}
.slot .n{color:var(--dim);font-size:.75rem;margin-right:6px}
.slot .st{color:var(--dim);font-size:.75rem;white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
select,input,textarea,button{font:inherit}
select,input[type=text],input[type=password],textarea{background:var(--navy);color:var(--white);border:1px solid var(--faint);border-radius:8px;padding:8px}
textarea{width:100%}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.sec{background:var(--navy3)}
button:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc{background:var(--navy3);border:1px solid var(--faint);border-radius:10px;padding:10px;text-align:left;color:var(--white);cursor:default}
.host .pc{cursor:pointer}.host .pc:hover{border-color:var(--gold)}
.pc b{display:block;font-size:1rem;margin-bottom:4px}
.pool{width:100%;border-collapse:collapse;font-size:.95rem}.pool th{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 6px;border-bottom:1px solid var(--faint);cursor:pointer;white-space:nowrap}.pool th.num,.pool td.num{text-align:right;font-variant-numeric:tabular-nums}.pool th.on{color:var(--gold)}.pool td{padding:9px 6px;border-bottom:1px solid var(--faint)}.pool td.on{color:#fff;font-weight:700}.pool td.nm{font-weight:700}.pool td.none{color:var(--dim)}.pool tr.pr.can{cursor:pointer}@media(max-width:480px){.pool{font-size:.85rem}.pool th{white-space:normal;padding:6px 3px;line-height:1.1}.pool td{padding:8px 3px}}.pool tr.pr.can:hover td{background:var(--navy3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;background:var(--navy);border-radius:6px;padding:2px 7px;color:var(--dim)}
.chip i{font-style:normal;color:var(--white);font-weight:700}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--navy2);border-top:2px solid var(--gold);padding:16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:9}
.coin{font-size:3rem;display:inline-block}
.coin.flip{animation:flip 1.4s ease-in-out}
@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(1800deg)}}
.err{color:var(--bad);font-weight:600}
.hint{color:var(--dim);font-size:.85rem}
/* Saturday pairs */
.pstat{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.pstat span{background:var(--navy3);border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:600}
.ptabs{display:flex;gap:8px;margin:6px 0 10px}.ptabs button{background:var(--navy3);border:2px solid transparent}.ptabs button.on{border-color:#fff;background:var(--navy);font-weight:800}
.pp{background:var(--navy3);border:2px solid var(--faint);border-radius:10px;padding:10px;text-align:left;color:var(--white)}
.pp.sel{border-color:#fff;background:#1d5fc4;box-shadow:0 0 0 2px #fff inset}
.pairc{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy3);border-radius:10px;padding:10px 12px;margin:6px 0;border-left:5px solid var(--faint)}
.pairc b{font-size:1rem}.pairc .num{font-size:.85rem;color:var(--dim)}
.cred .pairc,.pairc.cred{border-left-color:var(--red)}.cblue .pairc,.pairc.cblue{border-left-color:var(--blue)}
.pairc button{padding:4px 10px}
.mu-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.backrow{padding:8px 4px 0}.backrow a{color:var(--dim);font-size:.9rem;text-decoration:none;font-weight:600}.backrow a:hover{color:#fff}
.pairc.tap{cursor:pointer;border:2px solid #fff}.pairc.sel{background:#1a7f3c}.pairc.used{opacity:1;background:#0f2a55;border-left-width:4px}
.match{background:var(--navy3);border-radius:10px;padding:10px 12px;margin:8px 0}
.match .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.match .vs>div:first-child{text-align:right}
.match .vs b{display:block}.match .vs span.num{font-size:.8rem;color:var(--dim)}.match .vs .x{color:var(--dim);font-weight:700}
.match .n{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pnote{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.88rem}
@media(max-width:560px){.teams{gap:8px}.mhead{font-size:.9rem}.card.team{padding:10px}.slot{font-size:.85rem}.slot .st{width:100%;font-size:.7rem}}
</style>
</head>
<body>
<div class="page" id="app"><div class="stripes"></div><div class="hero"><div class="eyebrow">★ BirdieFriends ★</div><h1>BF Cup Draft</h1></div><p class="hint">Loading…</p></div>
<script src="bf_engine.js?v=1.39.0"></script>
<script src="bf_live_match.js?v=9"></script>
<script>
(function () {
  'use strict';
  var WORKER = 'https://bf-experiences.birdiefriends01.workers.dev';
  var qs = new URLSearchParams(location.search);
  var EVENT = qs.get('event') || '2026 BF Cup';
  var HOST = qs.get('host') === '1';
  var CAP = qs.get('cap') || '', YOU = '';
  var PRACTICE = /\(practice\)$/.test(EVENT);
  var cfg = null, pin = '', busy = false, pending = null, error = '', sortBy = 'rank', lastPickNo = 0, coinFlip = false, notice = '';
  try { pin = sessionStorage.getItem('bf_cup_pin') || ''; } catch (e) {}
  var E = window.BFEngine;
  var app = document.getElementById('app');
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function sideName(k) { var s = (cfg.sides || []).filter(function (x) { return x.key === k; })[0]; return s ? (s.name || 'Side ' + k) : k; }
  function colorOf(sd, i) { return sd && sd.color === 'blue' ? 'cblue' : sd && sd.color === 'red' ? 'cred' : (i ? 'cblue' : 'cred'); }
  function fmt(v, d) { return typeof v === 'number' ? (d == null ? String(Math.round(v * 10) / 10) : v.toFixed(d)) : '–'; }

  function load() {
    var extra = CAP ? '&cap=' + encodeURIComponent(CAP) : (HOST && pin ? '&pin=' + encodeURIComponent(pin) : '');
    return fetch(WORKER + '/bfe/cup?event=' + encodeURIComponent(EVENT) + extra + '&_=' + Date.now()).then(function (r) {
      if (r.status === 404) { cfg = null; error = 'No Cup is saved under the name "' + EVENT + '". Check the event name in the link (event=...) matches BFE-Admin exactly, or save the Cup in BFE-Admin first.'; return; }
      if (r.status === 403) { cfg = null; error = CAP ? 'That captain link is not valid. Ask the commissioner for a fresh one.' : 'Not allowed.'; return; }
      return r.json().then(function (j) { cfg = j.config; YOU = j.you || ''; error = ''; });
    }).catch(function (e) { error = 'Could not reach the server: ' + e.message; });
  }
  // Setup opens already filled in: the roster and handicaps from the event (BFE-Admin) and the series stats, with no button to press.
  // Runs once per page load, for the host, before the draft starts. The player list is only set when it is empty (so typed edits are never wiped);
  // handicaps and series stats are refreshed every time. The practice copy keeps its sample data.
  var autoDone = false;
  function autoFill() {
    if (autoDone || !cfg || !(HOST && pin) || PRACTICE || (cfg.draft && cfg.draft.started)) return Promise.resolve(false);
    autoDone = true;
    var d = draft(); d.stats = d.stats || {}; var base = EVENT, got = { players: 0, hcp: 0, series: 0, rosterMissing: false };
    return fetch(WORKER + '/bfe/events?event=' + encodeURIComponent(base)).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var roster = j && j.config ? (j.config.roster || []).filter(function (p) { return p && p.name && !p.withdrawn; }) : [];
      if (!roster.length) { got.rosterMissing = true; return; }
      if (!(d.pool || []).length) { d.pool = roster.map(function (p) { return String(p.name).trim(); }); cfg.pool = d.pool; }
      got.players = d.pool.length;
      roster.forEach(function (p) { var nm = String(p.name).trim(); if (p.hcp !== null && p.hcp !== undefined && p.hcp !== '' && isFinite(Number(p.hcp))) { d.stats[nm] = Object.assign({}, d.stats[nm], { hcp: Number(p.hcp) }); got.hcp++; } });
    }).catch(function () { got.rosterMissing = true; }).then(function () {
      var names = (d.pool || []).concat(cfg.sides.map(function (x) { return x.captain; }).filter(Boolean));
      if (!names.length) return;
      return fetch('results.html?_=' + Date.now()).then(function (r) { return r.text(); }).then(function (html) {
        var m = html.match(/const ALL_SERIES_DATA = (\{[\s\S]*?\});\s*\n/); if (!m) return;
        var r = E.cupSeriesStats(JSON.parse(m[1]), names);
        Object.keys(r.stats).forEach(function (k) { var cur = d.stats[k] || {}, nw = r.stats[k]; d.stats[k] = { hcp: cur.hcp != null ? cur.hcp : null, rank: nw.rank, avg: nw.avg, birdies: nw.birdies }; got.series++; });
      }).catch(function () {});
    }).then(function () {
      notice = got.rosterMissing && !got.players ? 'The event has no roster saved yet, so type the players below (or save the roster in BFE-Admin, section 3).' : 'Loaded ' + got.players + ' players, ' + got.hcp + ' handicaps and ' + got.series + ' series records automatically.';
      return save();
    });
  }
  function save() {
    busy = true;
    return fetch(WORKER + '/bfe/cup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT, config: cfg, pin: pin }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); error = ''; }); })
      .catch(function (e) { error = 'Save failed: ' + e.message + (/Unauthorized/.test(e.message) ? ' (check the PIN)' : ''); })
      .then(function () { busy = false; render(); });
  }
  function draft() { if (!cfg.draft) cfg.draft = { picks: [], stats: {} }; return cfg.draft; }

  // ---------- meter ----------
  function meterHtml(v) {
    var d = cfg.draft || {}; var bal = E.cupBalance(v.teams, d.stats || {});
    var A = cfg.sides[0].key, B = cfg.sides[1].key;
    function row(label, f, dec, mk, suffix) {
      var a = bal.sides[A][f], b = bal.sides[B][f];
      var m = bal.metrics[mk || f];
      var win = m && m.edge;
      return '<div class="mrow"><div class="' + (win === A ? 'win ' + colorOf(cfg.sides[0], 0) : '') + '">' + fmt(a, dec) + (suffix ? suffix(bal.sides[A]) : '') + '</div><div class="lab">' + label + '</div><div class="' + (win === B ? 'win ' + colorOf(cfg.sides[1], 1) : '') + '">' + fmt(b, dec) + (suffix ? suffix(bal.sides[B]) : '') + '</div></div>';
    }
    var edges = {}; Object.keys(bal.metrics).forEach(function (f) { var m = bal.metrics[f]; if (m && m.level === 2 && m.edge) edges[m.edge] = (edges[m.edge] || 0) + 1; });
    var fav = Object.keys(edges).sort(function (a, b) { return edges[b] - edges[a]; })[0];
    var vtxt = { even: '🟢 Dead even', close: '🟡 Close', tilted: '⚠️ Tilted' + (fav ? ' toward ' + esc(sideName(fav)) : ''), unknown: 'Add player stats to see the balance' }[bal.verdict];
    return '<div class="meter"><div class="mhead"><div class="' + colorOf(cfg.sides[0], 0) + '">' + esc(sideName(A)) + '</div><div class="hint">Team balance</div><div class="' + colorOf(cfg.sides[1], 1) + '">' + esc(sideName(B)) + '</div></div>'
      + row('Avg HCP', 'hcp', 1) + row('Avg vs Quota', 'avg', 1) + row('Avg rank', 'rank', 1)
      + row('🐦 Birdies', 'birdieTotal', 0, 'birdies', function (s) { return ' <span class="hint">(' + fmt(s.birdies, 1) + ' avg)</span>'; })
      + '<div class="verdict v-' + bal.verdict + '">' + vtxt + '</div></div>';
  }
  // ---------- cards ----------
  function chipsFor(name) {
    var s = ((cfg.draft || {}).stats || {})[name] || {};
    return '<div class="chips"><span class="chip">HCP <i>' + fmt(s.hcp) + '</i></span><span class="chip">Rank <i>' + (s.rank != null ? '#' + s.rank : '–') + '</i></span><span class="chip">Avg vs Quota <i>' + fmt(s.avg) + '</i></span><span class="chip">🐦 <i>' + fmt(s.birdies, 0) + '</i></span></div>';
  }
  function stLine(name) { var s = ((cfg.draft || {}).stats || {})[name] || {}; return 'HCP ' + fmt(s.hcp) + ' · #' + (s.rank != null ? s.rank : '–') + ' · ' + fmt(s.avg) + ' · 🐦' + fmt(s.birdies, 0); }
  function sorted(list) {
    var st = (cfg.draft || {}).stats || {};
    var key = { rank: function (n) { return (st[n] || {}).rank; }, hcp: function (n) { return (st[n] || {}).hcp; }, avg: function (n) { return -((st[n] || {}).avg == null ? NaN : (st[n] || {}).avg); }, birdies: function (n) { return -((st[n] || {}).birdies == null ? NaN : (st[n] || {}).birdies); }, name: function (n) { return n.toLowerCase(); } }[sortBy];
    return list.slice().sort(function (a, b) {
      var x = key(a), y = key(b);
      var xn = x == null || (typeof x === 'number' && isNaN(x)), yn = y == null || (typeof y === 'number' && isNaN(y));
      if (xn && yn) return a.localeCompare(b); if (xn) return 1; if (yn) return -1;
      return x < y ? -1 : x > y ? 1 : 0;
    });
  }
  function teamsHtml(v) {
    return '<div class="teams">' + cfg.sides.map(function (sd, si) {
      var picks = v.picks.filter(function (p) { return p.side === sd.key; });
      return '<div class="card team ' + colorOf(sd, si) + '"><h2>' + esc(sd.name || 'Side ' + sd.key) + '</h2>'
        + (sd.captain ? '<div class="slot cap"><span>👑 ' + esc(sd.captain) + '</span><span class="st">' + esc(stLine(sd.captain)) + '</span></div>' : '')
        + picks.map(function (p) { return '<div class="slot' + (p.n === lastPickNo && p.n === v.picks.length ? ' new' : '') + '"><span><span class="n">#' + p.n + '</span>' + esc(p.player) + (p.auto ? ' <span class="hint">· last spot</span>' : '') + '</span><span class="st">' + esc(stLine(p.player)) + '</span></div>'; }).join('')
        + '</div>';
    }).join('') + '</div>';
  }
  function canPick(v) { return !!v.onClock && ((HOST && !!pin) || (!!YOU && v.onClock === YOU)); }
  function genCode() { var a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', o = ''; for (var i = 0; i < 6; i++) o += a.charAt(Math.floor(Math.random() * a.length)); return o; }
  function linksHtml() {
    if (!(HOST && pin) || !cfg.access) return '';
    return '<div class="card"><h2>Captain links</h2><p class="hint">Send each captain his own link. It lets him pick for his side when it is his turn, and nothing else.</p>' + cfg.sides.map(function (sd) {
      var url = location.origin + location.pathname + '?event=' + encodeURIComponent(EVENT) + '&cap=' + cfg.access[sd.key];
      return '<div class="toolbar"><b>' + esc(sd.name || 'Side ' + sd.key) + (sd.captain ? ' · ' + esc(sd.captain) : '') + '</b><input type="text" readonly value="' + esc(url) + '" style="flex:1;min-width:200px"><button class="sec" data-copy="' + esc(url) + '">Copy</button></div>';
    }).join('') + '</div>';
  }
  function poolHtml(v) {
    var cols = [['name', 'Player'], ['hcp', 'HCP'], ['rank', 'Rank'], ['avg', 'Avg vs Quota'], ['birdies', '🐦']];
    var st = (cfg.draft || {}).stats || {}, can = canPick(v);
    var head = '<tr>' + cols.map(function (c, i) { return '<th class="' + (i ? 'num' : '') + (sortBy === c[0] ? ' on' : '') + '" data-sort="' + c[0] + '">' + c[1] + (sortBy === c[0] ? ' ▾' : '') + '</th>'; }).join('') + '</tr>';
    var rows = sorted(v.remaining).map(function (n) {
      var s = st[n] || {};
      function td(val, key) { return '<td class="num' + (sortBy === key ? ' on' : '') + (val === '–' ? ' none' : '') + '">' + val + '</td>'; }
      return '<tr class="pr' + (can ? ' can' : '') + '" data-pick="' + esc(n) + '"><td class="nm' + (sortBy === 'name' ? ' on' : '') + '">' + esc(n) + '</td>' + td(fmt(s.hcp), 'hcp') + td(s.rank != null ? '#' + s.rank : '–', 'rank') + td(fmt(s.avg), 'avg') + td(fmt(s.birdies, 0), 'birdies') + '</tr>';
    }).join('');
    return '<div class="card"><div class="toolbar"><b>Available players (' + v.remaining.length + ')</b><span style="flex:1"></span><span class="hint">' + (can ? 'Tap a player to pick · ' : '') + 'tap a heading to sort · best first</span></div>'
      + '<table class="pool"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';
  }

  // ---------- Saturday matchup draw ----------
  var pendingPair = null, mpSel = '';
  function matchCardHtml(mt, i) {
    var st = (cfg.draft || {}).stats || {};
    function side(ms) { var si = cfg.sides.map(function (x) { return x.key; }).indexOf(ms.side); var sd = cfg.sides[si]; var n = E.cupPairStats(ms.players, st);
      return '<div class="' + colorOf(sd, si) + '"><b>' + esc(ms.players[0]) + ' &amp; ' + esc(ms.players[1]) + '</b><span class="num">' + esc(sd.name || ms.side) + ' · Avg HCP ' + (n.hcp === null ? '–' : fmt(n.hcp / 2)) + ' · Combined ' + fmt(n.hcp) + '</span></div>'; }
    var rule = E.cupHandicapRule(cfg), hcps = {};
    Object.keys(st).forEach(function (n) { var c = E.cupCourseHcp(st[n].hcp, rule); if (c !== null) hcps[n] = c; });
    var ri = E.cupPairsRound(cfg), fm = [];
    ((ri >= 0 ? cfg.rounds[ri].segments : []) || []).forEach(function (sg) { if (fm.indexOf(sg.format) < 0) fm.push(sg.format); });
    var line = E.cupMatchStrokeText(mt, hcps, rule, fm, sideName);
    return '<div class="match"><div class="n">Match ' + (i + 1) + '</div><div class="vs">' + side(mt.sides[0]) + '<div class="x">vs</div>' + side(mt.sides[1]) + '</div><div class="num" style="text-align:center;margin-top:6px;font-size:.82rem;color:var(--dim)">' + esc(line) + '</div></div>';
  }
  // The captain in control chooses to go first, defer, or flip a coin. `stage` is 'draft' or 'matchup'. Everyone else sees who is deciding; the host can always decide for him.
  function orderHtml(stage, control) {
    var what = stage === 'singles' ? 'put up the first player' : stage === 'matchup' ? 'put up the first pair' : 'pick first';

        var names = []; (cfg.rounds || []).forEach(function (r) { (r.matches || []).forEach(function (m) { m.sides.forEach(function (sd) { sd.players.forEach(function (p) { if (names.indexOf(p) < 0) names.push(p); }); }); }); });
        var who = '<div class="toolbar"><label class="hint">I am </label><select id="meSel"><option value="">(pick your name)</option>' + names.map(function (n) { return '<option' + (n === PLAYER ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></div>';
        app.className = 'page' + (HOST ? ' host' : ''); app.innerHTML = html + tabs + (singlesOpen() ? '<div class="banner live"><span class="dot"></span><span>The Sunday singles draw is open.</span><button data-view="teams">Open the singles draw</button></div>' : '') + '<div id="lmMount"></div>';
        mountScore(); wire(); return;
      }
      html += tabs;
    }

    var clock = v.onClock;
    if (d.orderChoice && d.orderChoice.text) html += '<div class="banner" style="background:#0a3161">🎲 ' + esc(d.orderChoice.text) + '</div>';
    if (v.awaitingOrder) html += orderHtml('draft', v.control);
    html += '<div class="banner live"><span class="dot"></span>' + (v.done ? (d.locked ? '🏁 Teams are set' : '✅ Every player is picked') : 'LIVE · Pick ' + v.pickNo + ' of ' + v.total + ' · <span style="color:#fff;text-decoration:underline">' + esc(sideName(clock)) + '</span> on the clock') + '</div>';
    if (YOU && !v.done) html += '<div class="banner" style="background:' + (v.onClock === YOU ? '#1a7f3c' : '#0a3161') + '">' + (v.onClock === YOU ? 'YOUR PICK, ' + esc(sideName(YOU)) + ' captain. Tap a player.' : 'Waiting for ' + esc(sideName(v.onClock)) + ' to pick') + '</div>';
    if (v.done && !d.locked) {
      var sg = d.signoff || {};
      html += '<div class="banner" style="background:#0a3161">' + cfg.sides.map(function (sd) { return (sg[sd.key] ? '✅ ' : '⏳ ') + esc(sd.captain || sideName(sd.key)) + (sg[sd.key] ? ' signed off' : ' to sign off'); }).join(' &nbsp;·&nbsp; ') + '</div>';
      if (YOU && !(HOST && pin)) html += '<div class="toolbar">' + (sg[YOU] ? '<span style="flex:1"><b>You signed off.</b> The teams lock when the other captain does.</span><button class="sec" id="unsign">Take it back</button>' : '<button id="signoff">Sign off on our team</button><span class="hint">Both captains sign off and the teams lock.</span>') + '</div>';
    }
    html += meterHtml(v) + teamsHtml(v) + (v.done ? '' : poolHtml(v)) + matchupHtml() + singlesHtml() + linksHtml();
    if (HOST && pin) {
      html += '<div class="toolbar">' + '<button class="sec" id="undo"' + (v.picks.length ? '' : ' disabled') + '>↩︎ Undo last pick</button>'
        + (v.done && !d.locked ? '<button id="lock">Lock the teams (host override)</button>' : '') + '<button class="sec" id="resetDraft">Start over</button></div>';
    }
    if (pendingSingle) html += '<div class="sheet"><span><b>' + esc(sideName(pendingSingle.side)) + '</b>: ' + (E.cupSinglesView(cfg).role === 'put' ? 'put up' : 'answer with') + ' <b>' + esc(pendingSingle.player) + '</b>?</span><button id="sgConfirm">Confirm</button><button class="sec" id="sgCancel">Cancel</button></div>';
    if (pendingPair) { var mu0 = E.cupMatchupView(cfg); html += '<div class="sheet"><span><b>' + esc(sideName(pendingPair.side)) + '</b>: ' + (mu0.role === 'put' ? 'put up' : 'answer with') + ' <b>' + esc(pendingPair.pair[0]) + ' &amp; ' + esc(pendingPair.pair[1]) + '</b>?</span><button id="muConfirm">Yes</button><button class="sec" id="muCancel">Cancel</button></div>'; }
    if (pending) html += '<div class="sheet"><span><b>' + esc(pending) + '</b> to <b>' + esc(sideName(clock)) + '</b>?</span><button id="confirmPick">Pick</button><button class="sec" id="cancelPick">Cancel</button></div>';
    app.className = 'page' + (HOST ? ' host' : ''); app.innerHTML = html; wire();
  }
  var view = qs.get('view') || '', PLAYER = qs.get('player') || ''; try { PLAYER = PLAYER || localStorage.getItem('bf_cup_me') || ''; } catch (e) {}
  var lmReady = false;
  function mountScore() {
    var el = document.getElementById('lmMount'); if (!el) return;
    var setv = function () { window.BFLiveMatch.setView(view); };
    if (!lmReady) {
      lmReady = true;
      window.BFLiveMatch.mount(el, { E: E, getCfg: function () { return cfg; }, worker: WORKER, event: EVENT, get player() { return PLAYER; }, code: CAP, get pin() { return HOST ? pin : ''; }, onChange: function () {}, goScore: function () { view = 'score'; render(); }, setPlayer: function (n) { PLAYER = n; try { localStorage.setItem('bf_cup_me', PLAYER); } catch (e) {} } });
      setv(); window.BFLiveMatch.attach(el);
    } else { setv(); window.BFLiveMatch.attach(el); }
  }
  function hero() { return '<div class="stripes"></div><div class="backrow"><a id="backApp" href="portal.html">← Back to the app</a></div><div class="hero"><div class="eyebrow">★ BirdieFriends ★</div><h1>BF Cup Draft</h1></div>' + (PRACTICE ? '<div class="banner" style="background:#b8860b">PRACTICE RUN · sample players, nothing here is real</div>' : ''); }

  function wire() {
    function $(id) { return document.getElementById(id); }
    function on(id, fn) { var el = $(id); if (el) el.addEventListener('click', fn); }
    matchupWire(); singlesWire();
    var ct = $('cardToggle'); if (ct) ct.addEventListener('click', function () { if (cfg.hide_card) delete cfg.hide_card; else cfg.hide_card = true; save(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) { b.addEventListener('click', function () { view = b.getAttribute('data-view'); render(); }); });
    var me = $('meSel'); if (me) me.addEventListener('change', function () { PLAYER = me.value; try { localStorage.setItem('bf_cup_me', PLAYER); } catch (e) {} render(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sort]'), function (h) { h.addEventListener('click', function () { sortBy = h.getAttribute('data-sort'); render(); }); });
    on('pinGo', function () { pin = $('pinIn').value.trim(); try { sessionStorage.setItem('bf_cup_pin', pin); } catch (e) {} render(); autoFill(); });
    function commitPool() {
      var el = $('poolTxt'); if (!el) return (cfg.draft && cfg.draft.pool) || [];
      var names = el.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      draft().pool = names; cfg.pool = names; return names;
    }
    on('poolSave', function () { var n = commitPool(); notice = 'Saved ' + n.length + ' player(s).'; save(); });
    on('loadRoster', function () {
      commitPool();
      var base = EVENT.replace(/ \(practice\)$/, '');
      fetch(WORKER + '/bfe/events?event=' + encodeURIComponent(base)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); }).then(function (j) {
        var roster = ((j.config || {}).roster || []).filter(function (p) { return p && p.name && !p.withdrawn; });
        if (!roster.length) { notice = 'The event "' + base + '" has no roster saved yet. Save the roster in BFE-Admin (section 3, then Save config).'; render(); return; }
        var d = draft(); d.stats = d.stats || {}; var h = 0;
        d.pool = roster.map(function (p) { return String(p.name).trim(); }); cfg.pool = d.pool;
        roster.forEach(function (p) { var nm = String(p.name).trim(); if (p.hcp !== null && p.hcp !== undefined && p.hcp !== '' && isFinite(Number(p.hcp))) { d.stats[nm] = Object.assign({}, d.stats[nm], { hcp: Number(p.hcp) }); h++; } });
        notice = 'Loaded ' + roster.length + ' players from "' + base + '" (' + h + ' with a handicap). Rank, points and birdies still come from the stats box below.'; save();
      }).catch(function (e) { error = 'Could not read the event roster: ' + e.message; render(); });
    });
    on('fillHcp', function () {
      commitPool();
      fetch(WORKER + '/bfe/players').then(function (r) { return r.json(); }).then(function (j) {
        var by = {}; (j.players || []).forEach(function (p) { by[String(p.name || '').trim().toLowerCase()] = p.current_hcp; });
        var d = draft(); d.stats = d.stats || {}; var n = 0;
        (d.pool || []).concat(cfg.sides.map(function (s) { return s.captain; }).filter(Boolean)).forEach(function (nm) {
          var h = by[nm.toLowerCase()]; if (typeof h === 'number') { d.stats[nm] = Object.assign({}, d.stats[nm], { hcp: h }); n++; }
        });
        notice = 'Handicaps filled for ' + n + ' of ' + ((d.pool || []).length) + ' player(s) from Membership.' + (n === 0 ? ' No names matched, so check the spelling against Membership.' : ''); save();
      }).catch(function (e) { error = 'Could not read Membership: ' + e.message; render(); });
    });
    on('statsApply', function () {
      commitPool(); var d = draft();
      if (!$('statsTxt').value.trim()) { notice = 'Paste the stats table into the box first, then Apply.'; render(); return; } var names = (d.pool || []).concat(cfg.sides.map(function (s) { return s.captain; }).filter(Boolean));
      var r = E.cupParseStats($('statsTxt').value, names);
      d.stats = d.stats || {}; Object.keys(r.stats).forEach(function (k) {
        var cur = d.stats[k] || {}, nw = r.stats[k];
        d.stats[k] = { hcp: nw.hcp != null ? nw.hcp : cur.hcp, rank: nw.rank != null ? nw.rank : cur.rank, avg: nw.avg != null ? nw.avg : cur.avg, birdies: nw.birdies != null ? nw.birdies : cur.birdies };
      });
      notice = r.matched + ' matched' + (r.unmatched.length ? '; not in the player list: ' + r.unmatched.join(', ') : '') + '.'; save();
    });
    var cs = $('ctlSel'); if (cs) cs.addEventListener('change', function () { commitPool(); var dd = draft(); if (cs.value) { dd.control = cs.value; dd.first = null; } else { delete dd.control; } save(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (b) { b.addEventListener('click', function () { commitPool(); draft().mode = b.getAttribute('data-mode'); save(); }); });
    on('loadSeries', function () {
      commitPool(); var d = draft(); d.stats = d.stats || {};
      var names = (d.pool || cfg.pool || []).concat(cfg.sides.map(function (x) { return x.captain; }).filter(Boolean));
      notice = 'Loading series results…'; render();
      fetch('results.html?_=' + Date.now()).then(function (r) { return r.text(); }).then(function (html) {
        var m = html.match(/const ALL_SERIES_DATA = (\{[\s\S]*?\});\s*\n/); if (!m) throw new Error('series data not found');
        var r = E.cupSeriesStats(JSON.parse(m[1]), names);
        Object.keys(r.stats).forEach(function (k) { var cur = d.stats[k] || {}, nw = r.stats[k]; d.stats[k] = { hcp: cur.hcp != null ? cur.hcp : null, rank: nw.rank, avg: nw.avg, birdies: nw.birdies }; });
        notice = r.matched + ' players loaded from the series' + (r.missing.length ? '; no series rounds: ' + r.missing.join(', ') : '') + '.'; save();
      }).catch(function (e) { notice = 'Could not load the series results (' + (e.message || e) + '). Paste the table instead.'; render(); });
    });
    on('toss', function () {
      commitPool(); var d = draft(); coinFlip = true; render();
      setTimeout(function () { d.first = cfg.sides[Math.random() < 0.5 ? 0 : 1].key; delete d.control; coinFlip = false; save(); }, 1400);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-first]'), function (b) { b.addEventListener('click', function () { commitPool(); draft().first = b.getAttribute('data-first'); delete draft().control; save(); }); });
    on('startDraft', function () { commitPool(); var d = draft(); if (!cfg.access) cfg.access = { A: genCode(), B: genCode() }; d.started = true; d.picks = d.picks || []; save(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function (b) { b.addEventListener('click', function () { if (canPick(E.cupDraftView(cfg))) { pending = b.getAttribute('data-pick'); render(); } }); });
    on('cancelPick', function () { pending = null; render(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) { b.addEventListener('click', function () { var u = b.getAttribute('data-copy'); try { navigator.clipboard.writeText(u); b.textContent = 'Copied'; } catch (e) { b.previousSibling.select(); } }); });
    on('confirmPick', function () {
      var who = pending; pending = null;
      if (YOU && !(HOST && pin)) {
        busy = true;
        fetch(WORKER + '/bfe/cup/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT, code: CAP, action: 'pick', player: who }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); cfg = j.config; lastPickNo = cfg.draft.picks.length; error = ''; }); })
          .catch(function (e) { error = e.message; }).then(function () { busy = false; return load(); }).then(render);
        return;
      }
      var r = E.cupDraftPick(cfg, who);
      if (!r.ok) { error = r.reason; render(); return; }
      cfg.draft = r.draft; lastPickNo = r.draft.picks.length; save();
    });
    on('undo', function () { cfg.draft = E.cupDraftUndo(cfg); lastPickNo = cfg.draft.picks.length; save(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ochoice]'), function (b) { b.addEventListener('click', function () {
      busy = true;
      fetch(WORKER + '/bfe/cup/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT, code: CAP, action: 'order', stage: b.getAttribute('data-ostage'), choice: b.getAttribute('data-ochoice') }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); cfg = j.config; error = ''; }); })
        .catch(function (e) { error = e.message; }).then(function () { busy = false; return load(); }).then(render);
    }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-oforce]'), function (b) { b.addEventListener('click', function () {
      var k = b.getAttribute('data-oforce');
      var st0 = b.getAttribute('data-ostage'); if (st0 === 'singles') cfg.singles = { started: true, first: k, log: [] }; else if (st0 === 'matchup') cfg.matchup = { started: true, first: k, log: [] }; else draft().first = k;
      save();
    }); });
    ['signoff', 'unsign'].forEach(function (act) { on(act, function () {
      busy = true;
      fetch(WORKER + '/bfe/cup/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT, code: CAP, action: act }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); cfg = j.config; error = ''; }); })
        .catch(function (e) { error = e.message; }).then(function () { busy = false; return load(); }).then(render);
    }); });
    on('lock', function () {
      var v = E.cupDraftView(cfg);
      cfg.sides.forEach(function (s) { s.players = v.teams[s.key].slice(); });
      cfg.draft.locked = true; save();
    });
    on('practiceMake', function () {
      var first = ['Alex','Ben','Cal','Dan','Eli','Finn','Gus','Hal','Ian','Joe','Kip','Lou','Max','Ned'];
      var pool = first.map(function (n) { return n + ' Sample'; });
      var stats = {}; var seed = 7;
      function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
      pool.concat(cfg.sides.map(function (sd) { return sd.captain; }).filter(Boolean)).forEach(function (n, i) {
        stats[n] = { hcp: Math.round((4 + rnd() * 20) * 10) / 10, rank: i + 1, avg: Math.round((rnd() * 6 - 3) * 100) / 100, birdies: Math.round(rnd() * 12) };
      });
      var copy = JSON.parse(JSON.stringify(cfg));
      delete copy.access; delete copy.pairs; delete copy.matchup; copy.sides.forEach(function (sd) { sd.players = []; });
      copy.rounds.forEach(function (r) { r.matches = []; });
      copy.pool = pool; copy.draft = { started: false, first: null, pool: pool, stats: stats, picks: [], locked: false };
      fetch(WORKER + '/bfe/cup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT + ' (practice)', config: copy, pin: pin }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); notice = 'Practice copy created.'; error = ''; }); })
        .catch(function (e) { error = 'Could not create the practice copy: ' + e.message; }).then(render);
    });
    on('practiceDelete', function () {
      if (!window.confirm('Delete this practice copy?')) return;
      fetch(WORKER + '/bfe/cup?event=' + encodeURIComponent(EVENT) + '&pin=' + encodeURIComponent(pin), { method: 'DELETE' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); location.href = location.pathname + '?event=' + encodeURIComponent(EVENT.replace(/ \(practice\)$/, '')) + '&host=1'; })
        .catch(function (e) { error = 'Could not delete: ' + e.message; render(); });
    });
    on('resetDraft', function () {
      if (!window.confirm('Clear every pick and start the draft over?')) return;
      cfg.draft.picks = []; cfg.draft.started = false; cfg.draft.locked = false; delete cfg.pairs; delete cfg.matchup; cfg.sides.forEach(function (s) { s.players = []; }); save();
    });
  }

  document.addEventListener('click', function (e) { var a = e.target.closest ? e.target.closest('#backApp') : null; if (!a) return; e.preventDefault(); try { if (window.opener && !window.opener.closed) { window.close(); return; } } catch (x) {} location.href = 'portal.html'; });
  load().then(function () { render(); return autoFill(); });
  setInterval(function () {
    if (busy || !cfg) return;
    if (HOST && !CAP && !(cfg.draft && cfg.draft.locked && pin)) return;
    var before = JSON.stringify(cfg);
    load().then(function () { if (JSON.stringify(cfg) === before) return; var n = cfg && cfg.draft && cfg.draft.picks ? cfg.draft.picks.length : 0; lastPickNo = n; render(); });
  }, 4000);
})();
</script>
</body>
</html>
