<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BF Cup Draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{--navy:#0a1f44;--navy2:#10306a;--navy3:#183f82;--accent:#d6203a;--red:#d6203a;--redlt:#ff6b78;--blue:#2f6fe0;--bluelt:#7fb2ff;--gold:#ffffff;--white:#ffffff;--dim:rgba(255,255,255,.68);--faint:rgba(255,255,255,.16);--good:#7fd69a;--warn:#ffd36b;--bad:#ff9a8a}
body{margin:0;background:var(--navy) radial-gradient(ellipse at 50% -10%,rgba(47,111,224,.35),transparent 60%);color:var(--white);font-family:'DM Sans',sans-serif;line-height:1.35}
.page{max-width:980px;margin:0 auto;padding:0 16px 90px}
h1,h2{font-family:'Baloo 2',sans-serif;margin:0}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 28px,#fff 28px 56px);margin:0 -16px}
.hero{text-align:center;padding:22px 0 14px;border-bottom:2px solid #fff}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#fff;font-weight:700}
.hero h1{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;line-height:1}
.banner{margin:14px 0;padding:10px 14px;border-radius:10px;background:var(--navy2);border:1px solid var(--faint);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.live{border-color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.card{background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:14px;margin:12px 0}
.meter{position:sticky;top:0;z-index:5;background:var(--navy2);border:1px solid var(--faint);border-radius:12px;padding:12px 14px;margin:12px 0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mhead,.mrow{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:center;text-align:center}
.mhead{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:4px}
.mrow{font-size:.95rem;padding:3px 0;border-top:1px solid var(--faint)}
.mrow .lab{color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.mrow .win{font-weight:800}.mrow .win.cred{color:var(--redlt)}.mrow .win.cblue{color:var(--bluelt)}
.mhead .cred{color:var(--redlt)}.mhead .cblue{color:var(--bluelt)}
.verdict{margin-top:8px;text-align:center;font-weight:700;font-size:.92rem}
.v-even{color:var(--good)}.v-close{color:var(--warn)}.v-tilted{color:var(--bad)}.v-unknown{color:var(--dim)}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.team h2{font-size:1.15rem;margin-bottom:6px}.card.team.cred{border-top:5px solid var(--red)}.card.team.cblue{border-top:5px solid var(--blue)}
.cred .slot{border-left:4px solid var(--red)}.cblue .slot{border-left:4px solid var(--blue)}
.slot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;padding:6px 8px;border-radius:8px;background:var(--navy3);margin:4px 0;font-size:.92rem}
.slot.cap{border:1px solid var(--gold)}
.slot.new{animation:pop 1.6s ease-out}
@keyframes pop{0%{background:#fff}100%{background:var(--navy3)}}
.slot .n{color:var(--dim);font-size:.75rem;margin-right:6px}
.slot .st{color:var(--dim);font-size:.75rem;white-space:nowrap}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
select,input,textarea,button{font:inherit}
select,input[type=text],input[type=password],textarea{background:var(--navy);color:var(--white);border:1px solid var(--faint);border-radius:8px;padding:8px}
textarea{width:100%}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.sec{background:var(--navy3)}
button:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc{background:var(--navy3);border:1px solid var(--faint);border-radius:10px;padding:10px;text-align:left;color:var(--white);cursor:default}
.host .pc{cursor:pointer}.host .pc:hover{border-color:var(--gold)}
.pc b{display:block;font-size:1rem;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;background:var(--navy);border-radius:6px;padding:2px 7px;color:var(--dim)}
.chip i{font-style:normal;color:var(--white);font-weight:700}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--navy2);border-top:2px solid var(--gold);padding:16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:9}
.coin{font-size:3rem;display:inline-block}
.coin.flip{animation:flip 1.4s ease-in-out}
@keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(1800deg)}}
.err{color:var(--bad);font-weight:600}
.hint{color:var(--dim);font-size:.85rem}
/* Saturday pairs */
.pstat{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.pstat span{background:var(--navy3);border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:600}
.ptabs{display:flex;gap:8px;margin:6px 0 10px}.ptabs button{background:var(--navy3);border:2px solid transparent}.ptabs button.on{border-color:#fff;background:var(--navy);font-weight:800}
.pp{background:var(--navy3);border:2px solid var(--faint);border-radius:10px;padding:10px;text-align:left;color:var(--white)}
.pp.sel{border-color:#fff;background:#1d5fc4;box-shadow:0 0 0 2px #fff inset}
.pairc{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy3);border-radius:10px;padding:10px 12px;margin:6px 0;border-left:5px solid var(--faint)}
.pairc b{font-size:1rem}.pairc .num{font-size:.85rem;color:var(--dim)}
.cred .pairc,.pairc.cred{border-left-color:var(--red)}.cblue .pairc,.pairc.cblue{border-left-color:var(--blue)}
.pairc button{padding:4px 10px}
.mu-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pairc.tap{cursor:pointer;border:2px solid #fff}.pairc.used{opacity:.45}
.match{background:var(--navy3);border-radius:10px;padding:10px 12px;margin:8px 0}
.match .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.match .vs>div:first-child{text-align:right}
.match .vs b{display:block}.match .vs span.num{font-size:.8rem;color:var(--dim)}.match .vs .x{color:var(--dim);font-weight:700}
.match .n{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pnote{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.88rem}
@media(max-width:560px){.teams{gap:8px}.mhead{font-size:.9rem}.card.team{padding:10px}.slot{font-size:.85rem}.slot .st{width:100%;font-size:.7rem}}
</style>
</head>
<body>
<div class="page" id="app"><div class="stripes"></div><div class="hero"><div class="eyebrow">★ BirdieFriends ★</div><h1>BF Cup Draft</h1></div><p class="hint">Loading…</p></div>
<script src="bf_engine.js?v=1.31.0"></script>
<script>
(function () {
  'use strict';
  var WORKER = 'https://bf-experiences.birdiefriends01.workers.dev';
  var qs = new URLSearchParams(location.search);
  var EVENT = qs.get('event') || '2026 BF Cup';
  var HOST = qs.get('host') === '1';
  var CAP = qs.get('cap') || '', YOU = '';
  var PRACTICE = /\(practice\)$/.test(EVENT);
  var cfg = null, pin = '', busy = false, pending = null, error = '', sortBy = 'rank', lastPickNo = 0, coinFlip = false, notice = '';
  try { pin = sessionStorage.getItem('bf_cup_pin') || ''; } catch (e) {}
  var E = window.BFEngine;
  var app = document.getElementById('app');
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function sideName(k) { var s = (cfg.sides || []).filter(function (x) { return x.key === k; })[0]; return s ? (s.name || 'Side ' + k) : k; }
  function colorOf(sd, i) { return sd && sd.color === 'blue' ? 'cblue' : sd && sd.color === 'red' ? 'cred' : (i ? 'cblue' : 'cred'); }
  function fmt(v, d) { return typeof v === 'number' ? (d == null ? String(Math.round(v * 10) / 10) : v.toFixed(d)) : '–'; }

  function load() {
    var extra = CAP ? '&cap=' + encodeURIComponent(CAP) : (HOST && pin ? '&pin=' + encodeURIComponent(pin) : '');
    return fetch(WORKER + '/bfe/cup?event=' + encodeURIComponent(EVENT) + extra + '&_=' + Date.now()).then(function (r) {
      if (r.status === 404) { cfg = null; error = 'No Cup is saved under the name "' + EVENT + '". Check the event name in the link (event=...) matches BFE-Admin exactly, or save the Cup in BFE-Admin first.'; return; }
      if (r.status === 403) { cfg = null; error = CAP ? 'That captain link is not valid. Ask the commissioner for a fresh one.' : 'Not allowed.'; return; }
      return r.json().then(function (j) { cfg = j.config; YOU = j.you || ''; error = ''; });
    }).catch(function (e) { error = 'Could not reach the server: ' + e.message; });
  }
  function save() {
    busy = true;
    return fetch(WORKER + '/bfe/cup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT, config: cfg, pin: pin }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); error = ''; }); })
      .catch(function (e) { error = 'Save failed: ' + e.message + (/Unauthorized/.test(e.message) ? ' (check the PIN)' : ''); })
      .then(function () { busy = false; render(); });
  }
  function draft() { if (!cfg.draft) cfg.draft = { picks: [], stats: {} }; return cfg.draft; }

  // ---------- meter ----------
  function meterHtml(v) {
    var d = cfg.draft || {}; var bal = E.cupBalance(v.teams, d.stats || {});
    var A = cfg.sides[0].key, B = cfg.sides[1].key;
    function row(label, f, dec, mk, suffix) {
      var a = bal.sides[A][f], b = bal.sides[B][f];
      var m = bal.metrics[mk || f];
      var win = m && m.edge;
      return '<div class="mrow"><div class="' + (win === A ? 'win ' + colorOf(cfg.sides[0], 0) : '') + '">' + fmt(a, dec) + (suffix ? suffix(bal.sides[A]) : '') + '</div><div class="lab">' + label + '</div><div class="' + (win === B ? 'win ' + colorOf(cfg.sides[1], 1) : '') + '">' + fmt(b, dec) + (suffix ? suffix(bal.sides[B]) : '') + '</div></div>';
    }
    var edges = {}; Object.keys(bal.metrics).forEach(function (f) { var m = bal.metrics[f]; if (m && m.level === 2 && m.edge) edges[m.edge] = (edges[m.edge] || 0) + 1; });
    var fav = Object.keys(edges).sort(function (a, b) { return edges[b] - edges[a]; })[0];
    var vtxt = { even: '🟢 Dead even', close: '🟡 Close', tilted: '⚠️ Tilted' + (fav ? ' toward ' + esc(sideName(fav)) : ''), unknown: 'Add player stats to see the balance' }[bal.verdict];
    return '<div class="meter"><div class="mhead"><div class="' + colorOf(cfg.sides[0], 0) + '">' + esc(sideName(A)) + '</div><div class="hint">Team balance</div><div class="' + colorOf(cfg.sides[1], 1) + '">' + esc(sideName(B)) + '</div></div>'
      + row('Avg HCP', 'hcp', 1) + row('Avg vs Quota', 'avg', 1) + row('Avg rank', 'rank', 1)
      + row('🐦 Birdies', 'birdieTotal', 0, 'birdies', function (s) { return ' <span class="hint">(' + fmt(s.birdies, 1) + ' avg)</span>'; })
      + '<div class="verdict v-' + bal.verdict + '">' + vtxt + '</div></div>';
  }
  // ---------- cards ----------
  function chipsFor(name) {
    var s = ((cfg.draft || {}).stats || {})[name] || {};
    return '<div class="chips"><span class="chip">HCP <i>' + fmt(s.hcp) + '</i></span><span class="chip">Rank <i>' + (s.rank != null ? '#' + s.rank : '–') + '</i></span><span class="chip">Avg vs Quota <i>' + fmt(s.avg) + '</i></span><span class="chip">🐦 <i>' + fmt(s.birdies, 0) + '</i></span></div>';
  }
  function stLine(name) { var s = ((cfg.draft || {}).stats || {})[name] || {}; return 'HCP ' + fmt(s.hcp) + ' · #' + (s.rank != null ? s.rank : '–') + ' · ' + fmt(s.avg) + ' · 🐦' + fmt(s.birdies, 0); }
  function sorted(list) {
    var st = (cfg.draft || {}).stats || {};
    var key = { rank: function (n) { return (st[n] || {}).rank; }, hcp: function (n) { return (st[n] || {}).hcp; }, avg: function (n) { return -((st[n] || {}).avg == null ? NaN : (st[n] || {}).avg); }, birdies: function (n) { return -((st[n] || {}).birdies == null ? NaN : (st[n] || {}).birdies); }, name: function (n) { return n.toLowerCase(); } }[sortBy];
    return list.slice().sort(function (a, b) {
      var x = key(a), y = key(b);
      var xn = x == null || (typeof x === 'number' && isNaN(x)), yn = y == null || (typeof y === 'number' && isNaN(y));
      if (xn && yn) return a.localeCompare(b); if (xn) return 1; if (yn) return -1;
      return x < y ? -1 : x > y ? 1 : 0;
    });
  }
  function teamsHtml(v) {
    return '<div class="teams">' + cfg.sides.map(function (sd, si) {
      var picks = v.picks.filter(function (p) { return p.side === sd.key; });
      return '<div class="card team ' + colorOf(sd, si) + '"><h2>' + esc(sd.name || 'Side ' + sd.key) + '</h2>'
        + (sd.captain ? '<div class="slot cap"><span>👑 ' + esc(sd.captain) + '</span><span class="st">' + esc(stLine(sd.captain)) + '</span></div>' : '')
        + picks.map(function (p) { return '<div class="slot' + (p.n === lastPickNo && p.n === v.picks.length ? ' new' : '') + '"><span><span class="n">#' + p.n + '</span>' + esc(p.player) + '</span><span class="st">' + esc(stLine(p.player)) + '</span></div>'; }).join('')
        + '</div>';
    }).join('') + '</div>';
  }
  function canPick(v) { return !!v.onClock && ((HOST && !!pin) || (!!YOU && v.onClock === YOU)); }
  function genCode() { var a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', o = ''; for (var i = 0; i < 6; i++) o += a.charAt(Math.floor(Math.random() * a.length)); return o; }
  function linksHtml() {
    if (!(HOST && pin) || !cfg.access) return '';
    return '<div class="card"><h2>Captain links</h2><p class="hint">Send each captain his own link. It lets him pick for his side when it is his turn, and nothing else.</p>' + cfg.sides.map(function (sd) {
      var url = location.origin + location.pathname + '?event=' + encodeURIComponent(EVENT) + '&cap=' + cfg.access[sd.key];
      return '<div class="toolbar"><b>' + esc(sd.name || 'Side ' + sd.key) + (sd.captain ? ' · ' + esc(sd.captain) : '') + '</b><input type="text" readonly value="' + esc(url) + '" style="flex:1;min-width:200px"><button class="sec" data-copy="' + esc(url) + '">Copy</button></div>';
    }).join('') + '</div>';
  }
  function poolHtml(v) {
    var opts = [['rank', 'Series rank'], ['hcp', 'Handicap'], ['avg', 'Avg vs Quota'], ['birdies', 'Birdies'], ['name', 'A–Z']];
    return '<div class="card"><div class="toolbar"><b>Available players (' + v.remaining.length + ')</b><span style="flex:1"></span><label class="hint">Sort <select id="sortSel">'
      + opts.map(function (o) { return '<option value="' + o[0] + '"' + (sortBy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label></div>'
      + '<div class="grid">' + sorted(v.remaining).map(function (n) { return '<button class="pc" data-pick="' + esc(n) + '"' + (canPick(v) ? '' : ' disabled style="opacity:1"') + '><b>' + esc(n) + '</b>' + chipsFor(n) + '</button>'; }).join('') + '</div></div>';
  }

  // ---------- Saturday pairs ----------
  var selectedP = '', pairTab = '';
  function pairsOf(side) { var p = (cfg.pairs || {})[side]; return p && Array.isArray(p.list) ? p.list : null; }
  function pairLocked(side) { var p = (cfg.pairs || {})[side]; return !!(p && p.locked); }
  function pairCount(side) { var p = (cfg.pairs || {})[side]; return p ? (Array.isArray(p.list) ? p.list.length : (p.count || 0)) : 0; }
  function numsFor(pr) { var n = E.cupPairStats(pr, (cfg.draft || {}).stats || {}); return 'HCP ' + fmt(n.hcp) + ' · Avg vs Quota ' + fmt(n.avg) + ' · 🐦 ' + fmt(n.birdies, 0); }
  function pairCard(pr, cls, x) { return '<div class="pairc ' + cls + '"><div><b>' + esc(pr[0]) + ' &amp; ' + esc(pr[1]) + '</b><div class="num">' + esc(numsFor(pr)) + '</div></div>' + (x != null ? '<button class="sec" data-unpair="' + x + '" aria-label="Break this pair">✕</button>' : '') + '</div>'; }
  function pairsEditSide() { return HOST && pin ? (pairTab || cfg.sides[0].key) : YOU; }
  function pairsHtml() {
    var d = cfg.draft || {}; if (!d.locked) return '';
    var rev = E.cupPairsRevealed(cfg), me = pairsEditSide();
    var out = '<div class="card"><h2>Saturday pairs</h2><p class="hint">Each captain splits his team into partners for Saturday. Nobody sees the other side\'s pairs until both captains lock them.</p><div class="pstat">'
      + cfg.sides.map(function (sd) { return '<span>' + esc(sd.name || 'Side ' + sd.key) + ': ' + (pairLocked(sd.key) ? '🔒 locked' : 'building · ' + pairCount(sd.key) + ' pair' + (pairCount(sd.key) === 1 ? '' : 's')) + '</span>'; }).join('') + '</div>';
    if (rev) {
      out += '<div class="banner" style="background:#1a7f3c">Both sides are locked. Here are the pairs.</div><div class="teams">' + cfg.sides.map(function (sd, si) {
        var list = pairsOf(sd.key) || [], st = (cfg.draft || {}).stats || {};
        return '<div class="card team ' + colorOf(sd, si) + '"><h2>' + esc(sd.name || 'Side ' + sd.key) + '</h2>' + list.map(function (pr) { return pairCard(pr, colorOf(sd, si)); }).join('')
          + '<div class="hint">Even-ness: ' + (E.cupPairsSpread(list, st) == null ? '–' : E.cupPairsSpread(list, st) + ' strokes between strongest and weakest pair') + '</div></div>';
      }).join('') + '</div>';
      if (HOST && pin) out += '<div class="toolbar">' + cfg.sides.map(function (sd) { return '<button class="sec" data-preopen="' + sd.key + '">Reopen ' + esc(sd.name || sd.key) + '</button>'; }).join('') + '</div>';
      return out + '</div>';
    }
    if (!me) return out + '<p class="hint">The captains are building their pairs. This page updates by itself.</p></div>';
    if (HOST && pin) out += '<div class="ptabs">' + cfg.sides.map(function (sd) { return '<button data-ptab="' + sd.key + '" class="' + (sd.key === me ? 'on' : '') + '">' + esc(sd.name || sd.key) + '</button>'; }).join('') + '</div>';
    var sdx = cfg.sides.filter(function (x) { return x.key === me; })[0], si = cfg.sides.indexOf(sdx), cls = colorOf(sdx, si);
    var roster = E.cupRosterOf(cfg, me), list = pairsOf(me) || [], locked = pairLocked(me), stt = E.cupPairsStatus(roster, list), stats = d.stats || {};
    var chips = stt.leftover.map(function (n) { return '<button class="pp' + (selectedP === n ? ' sel' : '') + '" data-pp="' + esc(n) + '"' + (locked ? ' disabled style="opacity:.6"' : '') + '><b style="display:block">' + (selectedP === n ? '✓ ' : '') + esc(n) + '</b>' + chipsFor(n) + '</button>'; }).join('');
    out += '<h2 class="' + cls + '" style="font-size:1.05rem;margin:6px 0">' + esc(sdx.name || 'Side ' + me) + (HOST && pin ? '' : ' · your pairs') + '</h2>';
    if (locked) out += '<div class="pnote">🔒 Locked. ' + (cfg.sides.every(function (x) { return pairLocked(x.key); }) ? '' : 'Waiting for the other captain. You can unlock to change them until then.') + '</div>';
    else if (stt.leftover.length) out += '<div class="pnote">' + (selectedP ? '<b>' + esc(selectedP) + '</b> is selected. Tap a partner.' : 'Tap a player, then tap a partner.') + (roster.length % 2 === 1 ? ' With an odd number, one player can sit out.' : '') + '</div>';
    else out += '<div class="pnote">Everyone is paired. Check the numbers, then lock.</div>';
    out += (chips ? '<div class="grid">' + chips + '</div>' : '') + '<div style="margin-top:8px">' + (list.length ? '<b>Pairs (' + list.length + ')</b>' : '') + list.map(function (pr, i) { return pairCard(pr, cls, locked ? null : i); }).join('') + '</div>';
    var sp = E.cupPairsSpread(list, stats);
    if (sp != null) out += '<div class="hint">Even-ness: ' + sp + ' strokes between your strongest and weakest pair (smaller is more even).</div>';
    out += '<div class="toolbar">' + (locked ? '<button class="sec" id="pUnlock">Unlock to edit</button>' : '<button class="sec" id="pSuggest">Suggest balanced pairs</button>' + (list.length ? '<button class="sec" id="pClear">Clear</button>' : '') + '<button id="pLock"' + (stt.lockable ? '' : ' disabled') + '>🔒 Lock my pairs</button>') + '</div></div>';
    return out;
  }
  function pairsSync(side, list, locked) {
    cfg.pairs = cfg.pairs || {};
    cfg.pairs[side] = { list: list, locked: !!locked };
    if (HOST && pin) { save(); return; }
    render();
    busy = true;
    var action = locked === true ? 'pair_lock' : locked === 'unlock' ? 'pair_unlock' : 'pair_set';
    fetch(WORKER + '/bfe/cup/act', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT, code: CAP, action: action, pairs: list }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); cfg = j.config; error = ''; }); })
      .catch(function (e) { error = e.message; }).then(function () { busy = false; return load(); }).then(render);
  }
  function pairsWire() {
    function $(id) { return document.getElementById(id); }
    function on(id, fn) { var el = $(id); if (el) el.addEventListener('click', fn); }
    var me = pairsEditSide(); if (!me) return;
    var list = (pairsOf(me) || []).map(function (p) { return p.slice(); });

    on('practiceMake', function () {
      var first = ['Alex','Ben','Cal','Dan','Eli','Finn','Gus','Hal','Ian','Joe','Kip','Lou','Max','Ned'];
      var pool = first.map(function (n) { return n + ' Sample'; });
      var stats = {}; var seed = 7;
      function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
      pool.concat(cfg.sides.map(function (sd) { return sd.captain; }).filter(Boolean)).forEach(function (n, i) {
        stats[n] = { hcp: Math.round((4 + rnd() * 20) * 10) / 10, rank: i + 1, avg: Math.round((rnd() * 6 - 3) * 100) / 100, birdies: Math.round(rnd() * 12) };
      });
      var copy = JSON.parse(JSON.stringify(cfg));
      delete copy.access; delete copy.pairs; delete copy.matchup; copy.sides.forEach(function (sd) { sd.players = []; });
      copy.rounds.forEach(function (r) { r.matches = []; });
      copy.pool = pool; copy.draft = { started: false, first: null, pool: pool, stats: stats, picks: [], locked: false };
      fetch(WORKER + '/bfe/cup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event_name: EVENT + ' (practice)', config: copy, pin: pin }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); notice = 'Practice copy created.'; error = ''; }); })
        .catch(function (e) { error = 'Could not create the practice copy: ' + e.message; }).then(render);
    });
    on('practiceDelete', function () {
      if (!window.confirm('Delete this practice copy?')) return;
      fetch(WORKER + '/bfe/cup?event=' + encodeURIComponent(EVENT) + '&pin=' + encodeURIComponent(pin), { method: 'DELETE' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); location.href = location.pathname + '?event=' + encodeURIComponent(EVENT.replace(/ \(practice\)$/, '')) + '&host=1'; })
        .catch(function (e) { error = 'Could not delete: ' + e.message; render(); });
    });
    on('resetDraft', function () {
      if (!window.confirm('Clear every pick and start the draft over?')) return;
      cfg.draft.picks = []; cfg.draft.started = false; cfg.draft.locked = false; delete cfg.pairs; delete cfg.matchup; cfg.sides.forEach(function (s) { s.players = []; }); save();
    });
  }

  load().then(function () { render(); });
  setInterval(function () {
    if (busy || !cfg) return;
    if (HOST && !CAP && !(cfg.draft && cfg.draft.locked && pin)) return;
    var before = JSON.stringify(cfg);
    load().then(function () { if (JSON.stringify(cfg) === before) return; var n = cfg && cfg.draft && cfg.draft.picks ? cfg.draft.picks.length : 0; lastPickNo = n; render(); });
  }, 4000);
})();
</script>
